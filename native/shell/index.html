<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Novus</title>
    <style>
      /*
       * A standalone document, so the design tokens are copied rather than
       * imported: the grounds are --n-1 in each theme (see app/globals.css),
       * the ink pair mirrors them, and #FF6B00 is --color-action — the one
       * colour that asks for something, on the one control this page has.
       */
      html {
        background: #f6f7f9;
        color: #1c1d21;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #1c1d21;
          color: #f6f7f9;
        }
      }
      html[data-theme="dark"] {
        background: #1c1d21;
        color: #f6f7f9;
      }
      html[data-theme="light"] {
        background: #f6f7f9;
        color: #1c1d21;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      main {
        max-width: 20rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.5;
        margin: 0 0 1.5rem;
        opacity: 0.75;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: #ff6b00;
        color: #fff;
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 0.875rem 2.5rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!--
      The only document the app still carries on the device.

      The shell loads the game from https://www.novuspitch.com (see
      capacitor.config.ts — server.url is the decision, webDir points at this
      directory). Capacitor shows this page in exactly one case: the remote
      origin could not produce a document, which for a phone means no network,
      a captive portal, or the site itself being down. So this page's whole
      job is to say that plainly and offer the retry.

      server.errorPath serves it from the LOCAL origin — the one place
      guaranteed to answer while the network is not. RETRY navigates back to
      the remote boot document; the origin below is the same value
      capacitor.config.ts holds, and scripts/build-native.mjs asserts the two
      still agree so they cannot drift apart silently.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("novus:theme:v1");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {
          /* storage denied — the prefers-color-scheme fallback stands */
        }
      })();
    </script>
    <main>
      <h1>NO CONNECTION</h1>
      <p>
        Novus plays from the live site, and it could not be reached. Check the
        connection and try again.
      </p>
      <button onclick="location.replace('https://www.novuspitch.com/boot.html')">
        RETRY
      </button>
    </main>
  </body>
</html>
