<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Novus</title>
    <style>
      /* The two grounds, matching --n-1 in each theme. Whatever this page
         paints is the last frame of the launch screen, so it has to be the
         same colour the app is about to be. */
      html {
        background: #f6f7f9;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #1c1d21;
        }
      }
      html[data-theme="dark"] {
        background: #1c1d21;
      }
      html[data-theme="light"] {
        background: #f6f7f9;
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!--
      The app's front door, and deliberately not a Next.js page.

      A framework route cannot answer "which screen does this player belong on"
      until the runtime, the router and the page chunk have all parsed — a
      couple of hundred milliseconds of nothing on a cold start, spent to read
      two keys out of localStorage. This document does it in one parse and
      hands the webview straight to the right route, so the launch screen is
      followed by the game rather than by a loading state.

      Generated into the app bundle only; the web build never serves it.
    -->
    <!--
      Every target below names index.html, and it is not optional.

      The shell serves navigations through CapacitorRouter.route(for:), which
      returns the bundle's ROOT index.html for any path with no file extension
      — it assumes a single-document SPA. This export is a document per route
      and the root is the marketing page, so "/play/" did not open the play
      screen, it opened the landing page. Including from here: this file was
      the first redirect of every launch, so the app opened on a marketing page
      it is never meant to show, and every way out of it came back.

      "/play/index.html" has an extension, so the router returns it untouched.
      See lib/native/href.ts, which is the same rule for the TypeScript side.
    -->
    <script>
      (function () {
        var target = "/welcome/index.html";
        try {
          var theme = localStorage.getItem("novus:theme:v1");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
          if (localStorage.getItem("novus:run:v1")) {
            target = "/play/index.html";
          } else {
            var raw = localStorage.getItem("novus:profile:v1");
            if (raw && JSON.parse(raw).onboarded) target = "/found/index.html";
          }
        } catch (e) {
          /* First launch, or storage denied. Onboarding is the right answer. */
        }
        location.replace(target);
      })();
    </script>
  </body>
</html>
