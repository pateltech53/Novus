    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const tl = gsap.timeline({ paused: true });
        const DIGIT_H = 64;

        // Build digit-column odometers for The Books values (synchronous, deterministic).
        const odoRolls = [];
        document.querySelectorAll(".n05-odo").forEach(function (odo) {
          const cols = [];
          odo.getAttribute("data-final").split("").forEach(function (ch) {
            if (/[0-9]/.test(ch)) {
              const col = document.createElement("span");
              col.className = "n05-odo-col";
              col.setAttribute("data-layout-ignore", "");
              col.setAttribute("data-target", ch);
              const stack = document.createElement("span");
              stack.className = "n05-odo-stack";
              for (let d = 0; d <= 9; d++) {
                const dg = document.createElement("span");
                dg.className = "n05-odo-digit";
                dg.textContent = String(d);
                stack.appendChild(dg);
              }
              col.appendChild(stack);
              odo.appendChild(col);
              cols.push({ stack: stack, target: parseInt(ch, 10) });
            } else {
              const st = document.createElement("span");
              st.className = "n05-odo-static";
              st.textContent = ch;
              odo.appendChild(st);
            }
          });
          odoRolls.push({ id: odo.id, cols: cols });
        });

        // Initial states owned by the timeline (cold-seek safe from t=0).
        tl.set("#n05-fill", { scaleX: 4 / 12, transformOrigin: "left center" }, 0);

        // Camera with intent: mapped pan across the scene.
        tl.fromTo(".n05-cam", { x: 0 }, { x: -36, autoAlpha: 1, duration: 7.0, ease: "power1.inOut" }, 0.4);

        // 0.2 — the phone settles (hero arrival, per beat sheet).
        tl.fromTo(
          "#n05-phone",
          { y: 40, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.55, ease: "expo.out" },
          0.2
        );

        // 0.48 — swipe pill appears; 0.7 — unlock swipe (audio: unlock at 0.7).
        tl.fromTo("#n05-pill", { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.18, ease: "power4.out" }, 0.48);
        tl.fromTo("#n05-shot", { y: 0 }, { y: -120, autoAlpha: 1, duration: 0.55, ease: "expo.out" }, 0.7);
        tl.to("#n05-pill", { y: -90, duration: 0.35, ease: "power2.out" }, 0.7);
        tl.to("#n05-pill", { autoAlpha: 0, duration: 0.2, ease: "power1.out" }, 0.78);

        // Copy line 1 — spread waterfall, shrinking gaps, 0.5 -> 2.7.
        const l1Times = [0.5, 1.18, 1.76, 2.26, 2.7];
        document.querySelectorAll("#n05-l1 .n05-w").forEach(function (el, i) {
          tl.fromTo(el, { y: 46, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.16, ease: "power4.out" }, l1Times[i]);
        });

        // 2.1 — months video tile reveals (stomp inside the footage reads ~2.75).
        tl.fromTo("#n05-tile", { x: 90, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.55, ease: "expo.out" }, 2.1);
        tl.fromTo("#n05-meter", { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power4.out" }, 2.3);

        // 2.75 — stomp impact: the tile takes the hit (causal squash, audio: activity).
        tl.to("#n05-tile", { scale: 0.982, duration: 0.07, ease: "power2.in", transformOrigin: "50% 100%" }, 2.72);
        tl.to("#n05-tile", { scale: 1, duration: 0.25, ease: "power2.out" }, 2.79);

        // 3.1 — the month advances: bar fill 4/12 -> 6/12, digit rolls 4 -> 6.
        tl.to("#n05-fill", { scaleX: 6 / 12, duration: 0.55, ease: "expo.out" }, 3.1);
        tl.fromTo("#n05-mstack", { y: 0 }, { y: -52, autoAlpha: 1, duration: 0.7, ease: "expo.out" }, 3.1);

        // 4.2 — nudge curve: device duo slides LEFT 320px (10/65/25 dist, 20/18/62 time).
        tl.to("#n05-duo", { x: -32, duration: 0.18, ease: "power3.in" }, 4.2);
        tl.to("#n05-duo", { x: -240, duration: 0.162, ease: "none" }, 4.38);
        tl.to("#n05-duo", { x: -320, duration: 0.558, ease: "power4.out" }, 4.542);

        // The Books strip enters right during the burst (shrinking gaps).
        const cardTimes = { "n05-card-cash": 4.28, "n05-card-burn": 4.43, "n05-card-run": 4.56 };
        Object.keys(cardTimes).forEach(function (id) {
          tl.fromTo(
            "#" + id,
            { x: 260, autoAlpha: 0 },
            { x: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out" },
            cardTimes[id]
          );
        });
        tl.fromTo("#n05-year", { x: 260, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out" }, 4.66);

        // 4.4 — the numbers roll (audio: money). Per-column odometer, expo.out, staggered.
        const rollStarts = { "n05-odo-cash": 4.4, "n05-odo-burn": 4.52, "n05-odo-run": 4.62 };
        odoRolls.forEach(function (r) {
          const T = rollStarts[r.id];
          r.cols.forEach(function (c, i) {
            tl.fromTo(
              c.stack,
              { y: 0 },
              { y: -DIGIT_H * c.target, autoAlpha: 1, duration: 0.9 + i * 0.08, ease: "expo.out" },
              T + i * 0.06
            );
          });
        });

        // Direction arrows pop with each roll — green = upside, red = burn damage.
        const arrowTimes = [4.42, 4.54, 4.64];
        document.querySelectorAll(".n05-arrow").forEach(function (el, i) {
          tl.fromTo(
            el,
            { y: 10, scale: 0.6, autoAlpha: 0 },
            { y: 0, scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(1.6)" },
            arrowTimes[i]
          );
        });

        // 4.6 — punch-chips, one every 0.25s.
        document.querySelectorAll(".n05-chip").forEach(function (el, i) {
          tl.fromTo(el, { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.16, ease: "power4.out" }, 4.6 + i * 0.25);
        });

        // 6.4 — YEAR 1 -> YEAR 2 whole-word roll (stillness held since ~5.9; chime at 6.5).
        tl.fromTo("#n05-ystack", { y: 0 }, { y: -140, autoAlpha: 1, duration: 0.55, ease: "expo.out" }, 6.4);

        // Gold tick flash on landing — prestige only, then it recedes.
        tl.fromTo(
          "#n05-ygold",
          { scaleX: 0, autoAlpha: 0, transformOrigin: "left center" },
          { scaleX: 1, autoAlpha: 1, duration: 0.3, ease: "expo.out" },
          6.6
        );
        tl.to("#n05-y2", { color: "#ffc24b", duration: 0.15, ease: "power1.out" }, 6.6);
        tl.to("#n05-ygold", { autoAlpha: 0, duration: 0.2, ease: "power2.in" }, 7.1);
        tl.to("#n05-y2", { color: "#0b1e36", duration: 0.3, ease: "power1.inOut" }, 7.25);

        // 6.9 — band (line 1 + chips) all out; 7.0 — closer line, small.
        tl.to("#n05-band", { y: 34, autoAlpha: 0, duration: 0.22, ease: "power2.in" }, 6.9);
        const l3Times = [7.0, 7.09, 7.17, 7.24, 7.31, 7.37];
        document.querySelectorAll("#n05-l3 .n05-w").forEach(function (el, i) {
          tl.fromTo(el, { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.16, ease: "power4.out" }, l3Times[i]);
        });

        window.__timelines["sc05-lifesim"] = tl;
      })();
    </script>
