        // Typewriter helper: reveal chars, walk the caret.
        const BAR_X = 84;
        function typeRun(sel, t0, span) {
          const chars = document.querySelectorAll(sel + " span");
          const per = span / chars.length;
          tl.set(sel, { autoAlpha: 1 }, t0 - 0.02);
          chars.forEach(function (c, i) {
            tl.set(c, { autoAlpha: 1 }, t0 + i * per);
          });
          // measure-free caret ride: shift caret with an approximate advance per char
          tl.to("#n01-caret", { x: chars.length * 15.2, duration: span, ease: "none" }, t0);
        }

        // Zoom match-cut between queries: push in, swap at peak blur, land closer.
        const bases = [1.0, 1.07, 1.14, 1.21, 1.28, 1.34];

          const peak = bases[k] + 0.42;
          tl.to(CAM, { scale: peak, filter: "blur(8px)", duration: 0.17, ease: "power3.in" }, tSubmit + 0.01);
          tl.set("#n01-q" + (k + 1), { autoAlpha: 0 }, tSubmit + 0.18);
          tl.set("#n01-caret", { x: 0 }, tSubmit + 0.18);
          tl.set("#n01-s" + (k + 1), { autoAlpha: 0 }, tSubmit + 0.18);

          tl.to(CAM, { scale: bases[k + 1], filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, tSubmit + 0.18);
