    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        // Build odometer digit columns synchronously at load (deterministic).
        const DIGIT_H = 62;
        ["s6-cash-val", "s6-burn-val", "s6-runway-val", "s6-valuation-val"].forEach(function (id) {
          const el = document.getElementById(id);
          if (!el || el.childNodes.length) return;
          el.getAttribute("data-final").split("").forEach(function (ch) {
            if (/[0-9]/.test(ch)) {
              const col = document.createElement("span");
              col.className = "s6-col";
              col.setAttribute("data-target", ch);
              const stack = document.createElement("span");
              stack.className = "s6-stack";
              for (let d = 0; d <= 9; d++) {
                const s = document.createElement("span");
                s.className = "s6-digit";
                s.textContent = String(d);
                stack.appendChild(s);
              }
              col.appendChild(stack);
              el.appendChild(col);
            } else {
              const s = document.createElement("span");
              s.className = "s6-static";
              s.textContent = ch;
              el.appendChild(s);
            }
          });
        });

        const tl = gsap.timeline({ paused: true });

        tl.fromTo(".s6-cam", { scale: 1.0 }, { scale: 1.04, duration: 8, ease: "power1.inOut" }, 0);

        // Frame floats in centered, tilt to flat.
        tl.fromTo(
          "#s6-frame",
          { y: 80, autoAlpha: 0, rotationY: -3.5, scale: 0.97, transformPerspective: 1400 },
          { y: 0, autoAlpha: 1, rotationY: 0, scale: 1, duration: 1.1, ease: "expo.out" },
          0.2
        );

        // Stat cards type on one by one.
        tl.fromTo("#s6-card-cash", { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.7, ease: "expo.out" }, 0.6);
        tl.fromTo("#s6-card-burn", { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.7, ease: "expo.out" }, 1.2);
        tl.fromTo("#s6-card-runway", { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.7, ease: "expo.out" }, 1.8);
        tl.fromTo("#s6-card-valuation", { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.7, ease: "expo.out" }, 2.4);

        // Numbers odometer-roll to their targets.
        [
          ["s6-cash-val", 1.0],
          ["s6-burn-val", 1.6],
          ["s6-runway-val", 2.2],
          ["s6-valuation-val", 2.8],
        ].forEach(function (pair) {
          const cols = document.querySelectorAll("#" + pair[0] + " .s6-col .s6-stack");
          cols.forEach(function (stack, i) {
            const target = Number(stack.parentNode.getAttribute("data-target"));
            tl.fromTo(
              stack,
              { y: 0 },
              { y: -DIGIT_H * target, duration: 0.9 + i * 0.08, ease: "expo.out" },
              pair[1] + i * 0.06
            );
          });
        });

        // Event card slides over the books for the final 3s.
        tl.fromTo(
          "#s6-event",
          { y: 640, autoAlpha: 1 },
          { y: 0, autoAlpha: 1, duration: 0.85, ease: "expo.out" },
          5.0
        );

        // Books grid is fully covered by the event card — hide it so occluded
        // text stops registering (and stops being probed) behind the overlay.
        tl.to("#s6-grid", { autoAlpha: 0, duration: 0.25, ease: "power1.in" }, 5.25);

        tl.fromTo(
          "#s6-la .s6-w",
          { y: 40, autoAlpha: 0, filter: "blur(6px)" },
          { y: 0, autoAlpha: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out", stagger: 0.09 },
          5.3
        );
        tl.fromTo(
          "#s6-lb .s6-w",
          { y: 40, autoAlpha: 0, filter: "blur(6px)" },
          { y: 0, autoAlpha: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out", stagger: 0.09 },
          5.9
        );

        window.__timelines["s6-books"] = tl;
      })();
    </script>
