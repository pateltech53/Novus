name: iOS build check

# The Liquid Glass chrome is Swift that no other job compiles. This is the only
# thing standing between a typo in ios/App/App/Native/ and finding it in Xcode.
#
# Unsigned, simulator-only: it answers "does it build", which is the question
# CI can answer without a signing identity. Shipping still happens from Xcode.

on:
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Report the toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "Liquid Glass needs Xcode 26 (Swift 6.2). On anything older the"
          echo "#if compiler(>=6.2) guards compile the pre-26 material instead,"
          echo "so a green run here does not by itself prove the glass path."

      # cap sync needs a webDir to copy, and the iOS project needs the bundle
      # it references. Skipping the sync leaves an empty App/App/public and a
      # build that fails for a reason that has nothing to do with the Swift.
      - name: Static export
        run: npm run build:native:only

      - name: Sync
        run: npx cap sync ios

      - name: Build for the simulator, unsigned
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
