name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, content, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The content pipeline fails the build on a dead flag gate or a malformed
      # outcome, so it runs before anything that would only fail later.
      - name: Content pipeline
        run: npm run events

      - name: Typecheck
        run: npx tsc --noEmit

      # Two things no other job can see.
      #
      # The Xcode project is a hand-maintained graph of object ids, and the
      # widget extension added a second build target to it. Getting that wrong
      # does not fail a build — it stops Xcode opening the project at all, on
      # somebody else's machine, with a message that names no line.
      #
      # The fixture is the other half: the widget extension carries a Swift
      # port of the price maths and the money format, and a change to
      # market.ts or format.ts that nobody regenerates against turns a lock
      # screen into a confident wrong number. Both checks are seconds.
      - name: Project file + the Swift ports' fixture
        run: npm run test:outside

      - name: Balance harness
        run: npm run sim 20 6

      # The AI routes degrade silently by design — every one of them has a
      # complete local fallback, so a broken contract looks exactly like an
      # unconfigured deploy and nothing anywhere reports it. This is the only
      # place that can. Stubs fetch: no keys, no network, no spend.
      - name: AI route contracts
        run: npm run test:ai

      # The board replays every submitted run against this exact engine, so the
      # suite that proves a tape replays to the company that produced it belongs
      # beside the balance harness rather than behind a database. It also
      # carries the Brand Law 4 assertions: nothing purchasable may move a
      # board, and a one-word edit to people.ts or holdings.ts re-breaks that
      # silently until somebody screenshots the top ten.
      - name: Leaderboard replay + Brand Law 4
        run: npm run test:board

      # The two daily rations — one company and one fiscal year a day on free —
      # were enforced on one of their two paths each and asserted by nothing at
      # all. The only daily-cap tests in the repo were SQL, against a function
      # the client never calls.
      - name: Daily rations
        run: npm run test:limits

      # A player reported that year 2 replayed year 1's exact activities and
      # questions, and they were right: neither the activity list nor the Tank's
      # questions had the fiscal year as an input. The balance harness cannot
      # see it — it never fires an activity and never opens the room.
      - name: Year-over-year variety
        run: npm run test:variety

      # The Room is gated on a twelve-row table of "would this business ever
      # cold call anybody", its numbers are generated from caller ids, and the
      # trade index and the dialler have to agree on who answers. Every one of
      # those fails silently: a wrong row hides a mechanic, a collision makes a
      # listing unreachable, and a lookup that stops being lenient just looks
      # like a typo to the player.
      - name: The Room — gate, numbers, lookup
        run: npm run test:room

      # The wardrobe used to cost FINISHED RUNS, which paid a founder for
      # abandoning companies — the opposite of what the game teaches. It now
      # costs fiscal years, and three of the four ways that can break are
      # silent: a demand that rewards the old behaviour, a fit that un-earns
      # when the ten-company record scrolls, and a migration that quietly takes
      # away a fit somebody already had.
      - name: The wardrobe — demands, ledger, migration
        run: npm run test:wardrobe

      # The Playbook tripled the shared activity list and added the first
      # two-level rows. Two things about that are invisible until a player hits
      # them: an option branch whose id is not on the tape replays as a
      # different company, and a late-stage founder ending up with FEWER things
      # to do than a garage is the exact defect the whole change exists to fix.
      - name: The Playbook — breadth, branches, escalation
        run: npm run test:playbook

      # `npm run build`, not `npx next build` — the difference is
      # `scripts/bundle-report.mjs --check`, and the difference cost a red
      # deploy. CI ran the bare Next build and passed; Vercel runs the package
      # script and failed on a per-route weight budget nothing in this workflow
      # had looked at. A budget the deploy enforces and CI does not is a budget
      # that is always found the expensive way.
      - name: Web build + per-route weight budget
        run: npm run build

  database:
    name: Migrations + RLS suite
    runs-on: ubuntu-latest

    # Every claim these routes make about who can read what bottoms out in
    # row-level security, and RLS is only checkable against a real Postgres.
    # The suites used to be run by hand, which in practice meant not at all.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The runner shells out to psql. It is on the ubuntu image already, but
      # which version drifts, and a missing client should fail as a missing
      # client rather than as a connection error.
      - name: psql
        run: psql --version

      # No npm ci: scripts/db-test.mjs has no dependencies, so this job does
      # not wait on an install it never uses.
      - name: Migrations and RLS suite
        run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  native-bundle:
    name: Static export + Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships some Android platforms and not others, and which
      # ones drift. This installs whatever compileSdk asks for and accepts the
      # licences, so the job fails on the code rather than on the image.
      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Proves the export the apps ship from still builds: it is a different
      # Next configuration to the web build and can break on its own.
      - name: Static export
        run: npm run build:native:only

      - name: Copy the bundle into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: novus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
