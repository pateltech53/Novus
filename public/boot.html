<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <!-- The app's front door, not a page anyone should be sent to by a search
         engine — it renders nothing and leaves immediately. -->
    <meta name="robots" content="noindex" />
    <title>Novus</title>
    <style>
      /* The two grounds, matching --n-1 in each theme. Whatever this page
         paints is the last frame of the launch screen, so it has to be the
         same colour the app is about to be. */
      html {
        background: #f6f7f9;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #1c1d21;
        }
      }
      html[data-theme="dark"] {
        background: #1c1d21;
      }
      html[data-theme="light"] {
        background: #f6f7f9;
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!--
      The shipped app's entry document, and deliberately not a Next.js page.

      capacitor.config.ts points server.appStartPath here, so this is the
      first thing the shell loads on every launch. A framework route cannot
      answer "which screen does this player belong on" until the runtime, the
      router and the page chunk have all parsed — a couple of hundred
      milliseconds of nothing on a cold start, spent to read two keys out of
      localStorage. This document does it in one parse and hands the webview
      straight to the right route, so the launch screen is followed by the
      game rather than by a loading state.

      It lives in public/ because the shell loads it from the live origin now
      (capacitor.config.ts documents that decision). Its bundled ancestor,
      native/boot.html, had to name every target "/route/index.html" because
      the local file server resolved extensionless paths to the marketing
      page; this one is answered by the real Next server, which resolves
      routes, so the targets are the routes themselves. A browser that
      stumbles in here is redirected the same way lib/entry.ts would have
      sent it.
    -->
    <script>
      (function () {
        var target = "/welcome";
        try {
          var theme = localStorage.getItem("novus:theme:v1");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
          /*
            Any island at all sends the player to the picker, which is what
            lib/entry.ts answers on the web. Two shapes are checked because a
            device that has not booted since islands shipped still carries the
            pre-islands key; lib/engine/save.ts migrates it into slot 0 on the
            first read, but that happens AFTER this file has already chosen
            where to go.
          */
          /*
            50, not 10: ISLAND_CAP is 50 (lib/monetization.ts), and the
            bundled ancestor of this file scanned only ten slots — a Pro
            player whose surviving companies all sat on slots 10+ was routed
            to /found, a screen demanding a new company, instead of to their
            archipelago. The bound must track the cap, not a hunch about it.
          */
          var anyIsland = localStorage.getItem("novus:run:v1") !== null;
          for (var i = 0; !anyIsland && i < 50; i++) {
            if (localStorage.getItem("novus:run:v1:" + i) !== null) anyIsland = true;
          }
          if (anyIsland) {
            target = "/islands";
          } else {
            var raw = localStorage.getItem("novus:profile:v1");
            if (raw && JSON.parse(raw).onboarded) target = "/found";
          }
        } catch (e) {
          /* First launch, or storage denied. Onboarding is the right answer. */
        }
        location.replace(target);
      })();
    </script>
  </body>
</html>
