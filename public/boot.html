<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <!-- The app's front door, not a page anyone should be sent to by a search
         engine — it renders nothing and leaves immediately. -->
    <meta name="robots" content="noindex" />
    <title>Novus</title>
    <style>
      /* The two grounds, matching --n-1 in each theme. Whatever this page
         paints is the last frame of the launch screen, so it has to be the
         same colour the app is about to be. */
      html {
        background: #f6f7f9;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #1c1d21;
        }
      }
      html[data-theme="dark"] {
        background: #1c1d21;
      }
      html[data-theme="light"] {
        background: #f6f7f9;
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!--
      The shipped app's entry document, and deliberately not a Next.js page.

      capacitor.config.ts points server.appStartPath here, so this is the
      first thing the shell loads on every launch. A framework route cannot
      answer "which screen does this player belong on" until the runtime, the
      router and the page chunk have all parsed — a couple of hundred
      milliseconds of nothing on a cold start, spent to read two keys out of
      localStorage. This document does it in one parse and hands the webview
      straight to the right route, so the launch screen is followed by the
      game rather than by a loading state.

      It lives in public/ because the shell loads it from the live origin now
      (capacitor.config.ts documents that decision). Its bundled ancestor,
      native/boot.html, had to name every target "/route/index.html" because
      the local file server resolved extensionless paths to the marketing
      page; this one is answered by the real Next server, which resolves
      routes, so the targets are the routes themselves. A browser that
      stumbles in here is redirected the same way lib/entry.ts would have
      sent it.

      ── The account check ──────────────────────────────────────────────────

      /welcome itself now requires an account partway through its own step
      order (wave → age → account → mic → …, app/welcome/page.tsx's
      AccountStep) — so a genuinely new device, no save and no account, still
      belongs here exactly as before; that screen is where the account gets
      made. What this file used to get wrong is the OTHER device: one with
      local save data — a run, or an onboarded profile — from before the
      account requirement existed at all (every device that ever played, on
      either side of this reversal, until now). It read novus:run:v1 and
      novus:profile:v1 alone and picked /islands or /found with no idea
      whether an account existed, so that save kept playing forever with
      nothing to attach an account to and no gate that would ever ask.
      novus:account:v1 is checked now, and its absence overrides the save
      data specifically for THAT case: a device with progress but no account
      goes to "/" instead — AccountGate creates or restores one with no
      onboarding narrative attached, which is the right amount of friction
      for a device that has already been playing. lib/auth/require-account.ts
      is the same rule applied to /found, /islands and /play directly (a
      bookmark, a shared link, a deep link) once this file has already let
      someone past. This is the same cache lib/account.ts's loadAccount()
      reads, kept in sync so this synchronous script and the framework agree
      on what "signed in" means without either one importing the other.
    -->
    <script>
      (function () {
        var target = "/welcome";
        try {
          var theme = localStorage.getItem("novus:theme:v1");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }

          /*
            Any island at all sends the player to the picker, which is what
            lib/entry.ts answers on the web. Two shapes are checked because a
            device that has not booted since islands shipped still carries the
            pre-islands key; lib/engine/save.ts migrates it into slot 0 on the
            first read, but that happens AFTER this file has already chosen
            where to go.
          */
          /*
            50, not 10: ISLAND_CAP is 50 (lib/monetization.ts), and the
            bundled ancestor of this file scanned only ten slots — a Pro
            player whose surviving companies all sat on slots 10+ was routed
            to /found, a screen demanding a new company, instead of to their
            archipelago. The bound must track the cap, not a hunch about it.
          */
          var anyIsland = localStorage.getItem("novus:run:v1") !== null;
          for (var i = 0; !anyIsland && i < 50; i++) {
            if (localStorage.getItem("novus:run:v1:" + i) !== null) anyIsland = true;
          }
          var hasSave = anyIsland;
          if (anyIsland) {
            target = "/islands";
          } else {
            var raw = localStorage.getItem("novus:profile:v1");
            if (raw && JSON.parse(raw).onboarded) {
              target = "/found";
              hasSave = true;
            }
          }

          if (hasSave) {
            // Its own try: a corrupt novus:account:v1 must not fall through to
            // the outer catch below and leave `target` at the picker or the
            // founding screen it had already been set to above — corrupt or
            // missing both mean "no account" here, the same as each other.
            var hasAccount = false;
            try {
              var rawAccount = localStorage.getItem("novus:account:v1");
              if (rawAccount) {
                var account = JSON.parse(rawAccount);
                hasAccount = !!(
                  account &&
                  typeof account.displayName === "string" &&
                  account.displayName.trim()
                );
              }
            } catch (accountError) {
              hasAccount = false;
            }
            // Progress with nothing to attach an account to yet — send it to
            // the front door instead of the picker or the founding screen,
            // neither of which this device may reach without one.
            if (!hasAccount) target = "/";
          }
        } catch (e) {
          /* First launch, or storage denied. Onboarding is the right answer —
             it is where an account gets made too. */
        }
        location.replace(target);
      })();
    </script>
  </body>
</html>
