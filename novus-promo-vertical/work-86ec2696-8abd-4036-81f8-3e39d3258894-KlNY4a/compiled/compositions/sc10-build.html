        // ---- montage cuts: each new card slides in over the previous,

        ];
        beats.forEach(function (b) {
          var t = b[0];
          // previous card + chip exit leftward (power2.in, fast).
          tl.to(b[3], { x: -80, autoAlpha: 0, duration: 0.3, ease: "power2.in" }, t);

            { x: 0, autoAlpha: 1, duration: 0.32, ease: "power4.out" },
            t

          // chip punch, bottom-left, just after the card lands its energy.

            { scale: 1, y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(1.6)" },
            t + 0.1
