    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        // ---- digit-column odometer builder (synchronous) ----
        function buildOdo(el) {
          var fin = el.getAttribute("data-final") || "";
          var st = el.getAttribute("data-from") || "";
          while (st.length < fin.length) st = " " + st;
          var H = parseFloat(el.getAttribute("data-cell") || "64");
          var W = el.getAttribute("data-colw") || "33";
          var cols = [];
          for (var i = 0; i < fin.length; i++) {
            var fch = fin.charAt(i);
            if (/[0-9]/.test(fch)) {
              var col = document.createElement("span");
              col.className = "n04-col";
              col.setAttribute("data-layout-ignore", "");
              col.style.width = W + "px";
              col.style.height = H + "px";
              var stack = document.createElement("span");
              stack.className = "n04-stack";
              for (var d = 0; d <= 9; d++) {
                var cell = document.createElement("span");
                cell.className = "n04-cell";
                cell.style.height = H + "px";
                cell.style.lineHeight = H + "px";
                cell.textContent = String(d);
                stack.appendChild(cell);
              }
              var blank = document.createElement("span");
              blank.className = "n04-cell";
              blank.style.height = H + "px";
              blank.style.lineHeight = H + "px";
              blank.textContent = "";
              stack.appendChild(blank);
              col.appendChild(stack);
              el.appendChild(col);
              var sch = st.charAt(i);
              cols.push({ stack: stack, from: /[0-9]/.test(sch) ? +sch : 10, to: +fch, h: H });
            } else {
              var sp = document.createElement("span");
              sp.className = "n04-static";
              sp.style.height = H + "px";
              sp.style.lineHeight = H + "px";
              sp.textContent = fch;
              el.appendChild(sp);
            }
          }
          return cols;
        }

        var odoCost = buildOdo(document.querySelector("#n04-odo-cost"));
        var odoBurn = buildOdo(document.querySelector("#n04-odo-burn"));
        var odoRunway = buildOdo(document.querySelector("#n04-odo-runway"));
        var odoXp = buildOdo(document.querySelector("#n04-odo-xp"));

        var tl = gsap.timeline({ paused: true });

        function roll(cols, T) {
          cols.forEach(function (c, i) {
            tl.fromTo(
              c.stack,
              { y: -c.h * c.from },
              { y: -c.h * c.to, autoAlpha: 1, duration: 0.9 + i * 0.08, ease: "expo.out" },
              T + i * 0.06
            );
          });
        }

        function waterfallWords(sel, at) {
          var gap = 0.09;
          document.querySelectorAll(sel).forEach(function (el) {
            tl.fromTo(el, { y: 46, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.16, ease: "power4.out" }, at);
            at += gap;
            gap *= 0.85;
          });
        }

        // Camera with intent: one slow push across the whole loop (grow — push-sign safe).
        tl.fromTo(
          ".n04-cam",
          { scale: 1.0, transformOrigin: "50% 42%" },
          { scale: 1.045, duration: 11.0, ease: "power1.inOut" }, 0.4);

        // v3 hero beat — say what Novus IS before showing the loop.
        tl.fromTo("#n04-hero", { y: 56, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 0.45);
        tl.to("#n04-hero", { y: -34, autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 2.05);

        // ============ P1 · create your founder (0.45–2.35) ============
        tl.fromTo("#n04-p1-label", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.16, ease: "power4.out" }, 2.45);
        tl.fromTo("#n04-p1-title", { y: 52, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.18, ease: "power4.out" }, 2.53);
        // avatar waterfall — shrinking gaps
        tl.fromTo("#n04-av1", { y: 54, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.17, ease: "power4.out" }, 2.6);
        tl.fromTo("#n04-av2", { y: 54, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.17, ease: "power4.out" }, 2.71);
        tl.fromTo("#n04-av3", { y: 54, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.17, ease: "power4.out" }, 2.8);
        tl.fromTo("#n04-av4", { y: 54, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.17, ease: "power4.out" }, 2.87);
        // selection ring pops on the first founder, then hops across the 2×2 grid
        tl.fromTo(
          "#n04-ring1",
          { scale: 0.6, autoAlpha: 0, transformOrigin: "50% 50%" },
          { scale: 1, autoAlpha: 1, duration: 0.16, ease: "back.out(1.6)" }, 2.74);
        tl.to("#n04-ring1", { x: 210, duration: 0.13, ease: "power2.inOut" }, 2.8);
        tl.to("#n04-ring1", { x: 0, y: 210, duration: 0.1, ease: "power2.inOut" }, 2.97);

        tl.to("#n04-ring1", { scale: 1.0, duration: 0.16, ease: "power2.inOut" }, 3.22);
        tl.fromTo(
