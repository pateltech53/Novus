  <script>
    (function () {
      var R = document.querySelector('[data-composition-id="03-advance"]') || document;
      var q  = function (s) { return R.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(R.querySelectorAll(s)); };

      var DUR = 6.5;

      var phone   = q("#f03-phone");
      var ruleSt  = q("#f03-rule");
      var kicker  = q("#f03-kicker");
      var num     = q("#f03-num");
      var h1toks  = qa("#f03-h1 .f03-htok");
      var h2toks  = qa("#f03-h2 .f03-h2tok");
      var words   = qa("#f03-h2 .f03-word");
      var shotB   = q("#f03-shotB");
      var shotC   = q("#f03-shotC");
      var btn     = q("#f03-btn");
      var burst   = q("#f03-burst");
      var chip    = q("#f03-chip");
      var chipA   = q("#f03-chip-a");
      var chipB   = q("#f03-chip-b");
      var sheet   = q("#f03-sheet");
      var masks   = qa(".f03-mask");
      var rings   = qa(".f03-ripple");
      var cursor  = q("#f03-cursor");
      var c1 = q("#f03-c1"), c2 = q("#f03-c2"), c3 = q("#f03-c3");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ==============================================================
         SCENE 1 (0.0–1.4s)
         The phone is ALREADY landed (push-slide LEFT brought it in) —
         only the residual leftward vector bleeds off. Camera locked.
         Headline reveals token by token on the first VO clause.
         ============================================================== */
      tl.fromTo(phone, { x: 14 }, { x: 0, duration: 0.62, ease: "power3.out" }, 0.06);

      tl.fromTo(ruleSt, { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, 0.06);
      tl.fromTo(kicker, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.18);
      tl.fromTo(num,    { opacity: 0 },         { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.30);

      var HEAD_AT = 0.34, HEAD_STAGGER = 0.115;
      h1toks.forEach(function (el, i) {
        tl.fromTo(el,
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.58, ease: "power3.out" },
          HEAD_AT + i * HEAD_STAGGER);
      });

      /* ==============================================================
         SCENE 2 (1.4–3.0s) — THE IGNITION.
         nudge-curve: slow ramp-in (10% dist / 19% time, power3.in)
         → linear burst (65% / 17%) → power4.out tail (25% / 64%),
         tail 3.4x the ramp-in in TIME. Straight path, so the cursor
         only crosses the frame edge well above the keep-out line.
         ============================================================== */
      var MOVE_AT = 1.46, DX = 822.6, DY = 154.9;

      tl.fromTo(cursor,
        { x: DX, y: DY },
        { x: DX * 0.90, y: DY * 0.90, duration: 0.16, ease: "power3.in" },
        MOVE_AT);
      tl.to(cursor,
        { x: DX * 0.25, y: DY * 0.25, duration: 0.15, ease: "none" },
        MOVE_AT + 0.16);
      tl.to(cursor,
        { x: 0, y: 0, duration: 0.55, ease: "power4.out" },
        MOVE_AT + 0.31);                                  /* tip settles 2.32s */

      /* press-release-spring — linear compression, then a two-step
         overshoot recovery built from power eases only, adjacency-chained so
         each phase starts exactly where the previous one ended. */
      var CLICK_AT = 2.40, PRESS_DUR = 0.12;
      tl.to(btn,    { scale: 0.95, duration: PRESS_DUR, ease: "power1.in" }, CLICK_AT);
      tl.to(btn,    { scale: 1.015, duration: 0.16, ease: "power2.out" },    CLICK_AT + PRESS_DUR);
      tl.to(btn,    { scale: 1,     duration: 0.26, ease: "power3.out" },    CLICK_AT + PRESS_DUR + 0.16);

      /* the cursor is the actor — it compresses MORE than the target */
      tl.to(cursor, { scale: 0.86, duration: PRESS_DUR, ease: "power1.in" }, CLICK_AT);
      tl.to(cursor, { scale: 1,    duration: 0.24, ease: "power2.out" },     CLICK_AT + PRESS_DUR);

      /* burst glow sits BEHIND the button, inside the screen clip */
      tl.fromTo(burst,
        { scale: 1, opacity: 0 },
        { scale: 2.4, opacity: 0.85, duration: 0.34, ease: "power2.out" },
        CLICK_AT + PRESS_DUR);
      tl.to(burst, { opacity: 0, duration: 0.5, ease: "power2.in" }, 2.90);

      /* cursor-click-ripple — rings live in DOM from t=0 at the button's
         visual centroid, held invisible by CSS until the click fires */
      tl.fromTo(rings,
        { scale: 0, opacity: 0.95 },
        { scale: 4, opacity: 0, duration: 0.78, ease: "power2.out",
          stagger: 0.09, immediateRender: false },
        CLICK_AT + 0.04);

      /* discrete-text-sequence — the month chip does NOT tween, it jumps
         state at a threshold; one driver, reverse-searched every frame */
      var SEQUENCE = [
        { t: 0.00, a: "JAN", b: "FEB" },
        { t: 2.46, a: "FEB", b: "MAR" }
      ];
      function stateAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }
      var monthDriver = { t: 0 };
      tl.fromTo(monthDriver, { t: 0 }, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var s = stateAt(monthDriver.t);
          if (chipA.textContent !== s.a) chipA.textContent = s.a;
          if (chipB.textContent !== s.b) chipB.textContent = s.b;
        }
      }, 0);

      tl.to(chip, { scale: 1.09, duration: 0.10, ease: "power2.out" }, 2.46);
      tl.to(chip, { scale: 1,    duration: 0.22, ease: "power3.out" }, 2.56);

      /* the screen advances: the dashboard hard-cuts to its post-month
         state (red deltas). Clipped at the seam row, so only figures move. */
      tl.fromTo(shotB, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 2.46);

      /* the cursor leaves the frame, mostly horizontally */
      tl.to(cursor, { x: 860, y: 110, duration: 0.52, ease: "power2.in" }, 2.86);

      /* ==============================================================
         SCENE 3 (3.0–4.6s) — the event card takes the screen.
         3d-page-scroll's translateY form: the outer card clips, the
         inner plate is allowed to overflow. Then the three decision
         rows land one at a time, left to right.
         ============================================================== */
      var SHEET_OFF = 470;
      tl.fromTo(sheet,
        { y: SHEET_OFF },
        { y: 0, duration: 0.50, ease: "power4.out" },
        2.98);

      var ROW_AT = 3.42, ROW_STAGGER = 0.18;
      masks.forEach(function (el, i) {
        tl.to(el,
          { clipPath: "inset(0px 0px 0px 100%)", duration: 0.30, ease: "power3.out" },
          ROW_AT + i * ROW_STAGGER);
      });

      /* the choice is made — the card drops away and the world under it
         has changed (third screen state, red deltas + the next gate) */
      tl.to(sheet, { y: SHEET_OFF, duration: 0.44, ease: "power3.in" }, 4.22);
      tl.fromTo(shotC, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, 4.30);

      /* ==============================================================
         SCENE 4 (4.6–6.5s) — kinetic-beat-slam.
         ONE tempo grid drives all three decisions; each gets a DIFFERENT
         entrance axis (scale+blur slam / side snap / rise+rotate).
         ============================================================== */
      var BASE = 4.30, PULSE = 0.16;
      var BEATS = [BASE + PULSE * 2, BASE + PULSE * 4, BASE + PULSE * 6];

      tl.fromTo(c1,
        { scale: 1.45, filter: "blur(14px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.38, ease: "power4.out" },
        BEATS[0]);
      tl.fromTo(c2,
        { x: -190, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.36, ease: "expo.out" },
        BEATS[1]);
      tl.fromTo(c3,
        { y: 66, rotation: 5, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.40, ease: "circ.out" },
        BEATS[2]);

      /* headline swap — the statement steps aside for the payoff line.
         Old line accelerates out left + blurs; new line arrives from the
         right on the mirrored ease, so the two share one velocity. */
      var OUT_AT = 5.44, IN_AT = 5.58;
      h1toks.forEach(function (el, i) {
        tl.fromTo(el,
          { x: 0, opacity: 1, filter: "blur(0px)" },
          { x: -70, opacity: 0, filter: "blur(9px)",
            duration: 0.28, ease: "power3.in", immediateRender: false },
          OUT_AT + i * 0.035);
      });
      h2toks.forEach(function (el, i) {
        tl.fromTo(el,
          { x: 76, opacity: 0, filter: "blur(10px)" },
          { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out" },
          IN_AT + i * 0.045);
      });

      /* asr-keyword-glow — karaoke amplitudes, ONE linear driver looping
         every word. 「你的」 holds the fire-orange clause (frame.md: one
         inked clause per statement), so its color never lerps — only its
         glow + scale ride the envelope. */
      var GLOW_AT = 5.58, GLOW_DUR = DUR - GLOW_AT;   /* 0.92s */
      var ATTACK = 0.12, RELEASE = 0.22;
      var MAX_BLUR = 34, MAX_SCALE_BOOST = 0.18;
      var REST_RGB   = { r: 110, g: 104, b: 98 };
      var ACTIVE_RGB = { r: 245, g: 243, b: 240 };

      var TIMINGS = {
        w1: { start: 0.08, end: 0.20, rest: 0.14 },
        w2: { start: 0.28, end: 0.62, rest: 0.62 },   /* keyword — ~2.8x window */
        w3: { start: 0.68, end: 0.84, rest: 0.14 }
      };

      function envelope(time, tm) {
        if (time < tm.start) return 0;
        if (time < tm.end) return Math.min((time - tm.start) / ATTACK, 1);
        var releaseEnd = tm.end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - tm.end) / RELEASE) * (1 - tm.rest);
        return tm.rest;
      }
      function lerpChannel(a, b, t) { return Math.round(a + (b - a) * t); }

      var glowDriver = { t: 0 };
      tl.fromTo(glowDriver, { t: 0 }, {
        t: GLOW_DUR,
        duration: GLOW_DUR,
        ease: "none",
        onUpdate: function () {
          for (var i = 0; i < words.length; i++) {
            var el = words[i];
            var tm = TIMINGS[el.getAttribute("data-word")];
            if (!tm) continue;
            var env = envelope(glowDriver.t, tm);
            var isKey = el.parentNode.className.indexOf("f03-kw") !== -1;
            if (isKey) {
              el.style.textShadow = "0 0 " + (MAX_BLUR * env).toFixed(2) +
                "px rgba(227,95,0," + (0.85 * env).toFixed(3) + ")";
            } else {
              el.style.color = "rgb(" +
                lerpChannel(REST_RGB.r, ACTIVE_RGB.r, env) + "," +
                lerpChannel(REST_RGB.g, ACTIVE_RGB.g, env) + "," +
                lerpChannel(REST_RGB.b, ACTIVE_RGB.b, env) + ")";
              el.style.textShadow = "0 0 " + (MAX_BLUR * env).toFixed(2) +
                "px rgba(245,243,240," + (0.55 * env).toFixed(3) + ")";
            }
            el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(4) + ")";
          }
        }
      }, GLOW_AT);

      window.__timelines["03-advance"] = tl;
    })();
  </script>
