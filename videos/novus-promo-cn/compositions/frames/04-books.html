  <script src="assets/gsap.min.js"></script>
  <script>
    (function () {
      var R = document.querySelector('[data-composition-id="04-books"]') || document;
      var q = function (s) { return R.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(R.querySelectorAll(s)); };

      var big      = q("#f04-big");
      var bignum   = q("#f04-bignum");
      var biglabel = q("#f04-biglabel");
      var badge    = q("#f04-badge");
      var chrome   = q("#f04-chrome");
      var hair     = q("#f04-hair");
      var toks     = qa(".f04-tok");
      var ruleStub = q("#f04-rule");
      var cards    = [q("#f04-card1"), q("#f04-card2"), q("#f04-card3"), q("#f04-card4")];
      var notes    = [q("#f04-note1"), q("#f04-note2"), q("#f04-note3"), q("#f04-note4")];
      var carets   = qa(".f04-caret");
      var cash     = q("#f04-cash");
      var burn     = q("#f04-burn");
      var runway   = q("#f04-runway");
      var valNum   = q("#f04-val");
      var gaugeLab = q("#f04-gaugelab");
      var gauge    = q("#f04-gauge");
      var fill     = q("#f04-fill");
      var segs     = qa(".f04-seg");
      var axis     = q("#f04-axis");
      var read     = q("#f04-read");

      /* deterministic thousands separator — never toLocaleString (locale-dependent) */
      function group(n) {
        var s = String(n), out = "", c = 0, i;
        for (i = s.length - 1; i >= 0; i--) {
          out = s.charAt(i) + out;
          c++;
          if (c % 3 === 0 && i > 0) out = "," + out;
        }
        return out;
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ===============================================================
         SCENE 1 (0.0–1.2s) — ink-black field, one instrument only.
         counting-dynamic-scale: 0 -> 237, the transform scale growing
         to final size on the SAME start / duration / ease. Nothing else
         is on screen.
      =============================================================== */
      var COUNT_AT = 0.08, COUNT_DUR = 1.10, COUNT_EASE = "power3.out";
      var START_SCALE = 165 / 360; /* START_SIZE / END_SIZE */

      tl.fromTo(big, { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power2.out" }, 0.06);

      var ev = { v: 0 };
      tl.fromTo(ev, { v: 0 }, {
        v: 237,
        duration: COUNT_DUR,
        ease: COUNT_EASE,
        onUpdate: function () { bignum.textContent = String(Math.round(ev.v)); }
      }, COUNT_AT);

      tl.fromTo(bignum,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT);

      /* label arrives before the count peaks */
      tl.fromTo(biglabel,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.50, ease: "power3.out" },
        0.50);

      /* ===============================================================
         SCENE 2 (1.2–2.4s) — scale-swap-transition.
         The 237 block shrinks + rushes away (power2.in) while the mono
         corner badge arrives on top of it at the frame's head; the main
         line then lands per-character beneath.
      =============================================================== */
      var TRIGGER = 1.24, EXIT_DUR = 0.34, OVERLAP = 0.16;

      tl.to(big, { scale: 0.58, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, TRIGGER);

      tl.fromTo(badge,
        { scale: 0.58, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.52, ease: "power3.out" },
        TRIGGER + EXIT_DUR - OVERLAP);

      /* chrome sets the stage quietly behind the swap */
      tl.fromTo(chrome, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 1.48);
      tl.fromTo(hair, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 1.54);

      /* per-character staggered reveal of the main line */
      var HEAD_AT = 1.70, HEAD_STAGGER = 0.048;
      toks.forEach(function (el, i) {
        tl.fromTo(el,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.50, ease: "power3.out" },
          HEAD_AT + i * HEAD_STAGGER);
      });

      /* ===============================================================
         SCENE 3 (2.4–4.4s) — THE BOOKS.
         spring-pop-entrance, one card per spoken word (现金 / 烧钱 /
         跑道 / 估值), each card's numeral counting up as it lands
         (counting-dynamic-scale, number + card as one beat).
      =============================================================== */
      tl.fromTo(ruleStub, { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, 2.36);

      var CARD_AT = [2.50, 2.80, 3.10, 3.40];
      var POP_DUR = 0.56;

      cards.forEach(function (el, i) {
        tl.fromTo(el,
          { scale: 0, opacity: 0, y: 28 },
          { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" },
          CARD_AT[i]);
      });

      var VAL_DUR = 0.62, VAL_EASE = "power3.out";

      var sCash = { v: 0 };
      tl.fromTo(sCash, { v: 0 }, {
        v: 23, duration: VAL_DUR, ease: VAL_EASE,
        onUpdate: function () { cash.textContent = String(Math.round(sCash.v)); }
      }, CARD_AT[0] + 0.10);

      var sBurn = { v: 0 };
      tl.fromTo(sBurn, { v: 0 }, {
        v: 2000, duration: VAL_DUR, ease: VAL_EASE,
        onUpdate: function () { burn.textContent = group(Math.round(sBurn.v)); }
      }, CARD_AT[1] + 0.10);

      var sRun = { v: 0 };
      tl.fromTo(sRun, { v: 0 }, {
        v: 11, duration: VAL_DUR, ease: VAL_EASE,
        onUpdate: function () { runway.textContent = String(Math.round(sRun.v)); }
      }, CARD_AT[2] + 0.10);

      var sVal = { v: 0 };
      tl.fromTo(sVal, { v: 0 }, {
        v: 23, duration: VAL_DUR, ease: VAL_EASE,
        onUpdate: function () { valNum.textContent = String(Math.round(sVal.v)); }
      }, CARD_AT[3] + 0.10);

      /* each note gets its own beat, AFTER its number lands */
      notes.forEach(function (el, i) {
        tl.fromTo(el,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" },
          CARD_AT[i] + 0.10 + VAL_DUR + 0.02);
      });

      /* ===============================================================
         SCENE 4 (4.4–6.0s) — THE MECHANISM SHOT.
         The 12-segment runway gauge draws in under the books, then
         EXTINGUISHES RIGHT-TO-LEFT, one segment per beat, fire-orange
         -> border-dark, via threshold state-switching
         (discrete-text-sequence): instant jumps, no smear. The runway
         numeral and the mono readout decrement on the same thresholds.
         It stops at THREE lit segments and holds perfectly still.
      =============================================================== */
      tl.fromTo(gaugeLab, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 4.18);
      tl.fromTo(gauge, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 4.20);

      /* stat-bars-and-fills : clip wipe, never a width tween */
      tl.fromTo(fill,
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.52, ease: "power2.out" },
        4.32);

      tl.fromTo(axis, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 4.58);

      /* the falling stat turns alert-red as the burn starts eating it */
      tl.to(runway, { color: "#D43A2A", duration: 0.45, ease: "power2.out" }, 4.84);
      tl.to(read,   { color: "#D43A2A", duration: 0.45, ease: "power2.out" }, 4.84);

      /* every line on the books is dropping */
      carets.forEach(function (el, i) {
        tl.fromTo(el,
          { opacity: 0 },
          { opacity: 1, duration: 0.30, ease: "power2.out" },
          4.86 + i * 0.07);
      });

      /* --- threshold state machine: 11 lit -> 3 lit, right to left --- */
      var ORANGE = "#E35F00", DEAD = "#282726";
      var EX_AT = 3.82, EX_SPAN = 1.93;
      var STEPS = [
        { t: 0.00, lit: 11 },
        { t: 1.10, lit: 10 },
        { t: 1.20, lit: 9 },
        { t: 1.30, lit: 8 },
        { t: 1.40, lit: 7 },
        { t: 1.50, lit: 6 },
        { t: 1.60, lit: 5 },
        { t: 1.70, lit: 4 },
        { t: 1.80, lit: 3 }
      ];

      function litAt(t) {
        for (var i = STEPS.length - 1; i >= 0; i--) {
          if (t >= STEPS[i].t) return STEPS[i].lit;
        }
        return 11;
      }

      var lastLit = -1;
      var driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, {
        t: EX_SPAN,
        duration: EX_SPAN,
        ease: "none",
        onUpdate: function () {
          var lit = litAt(driver.t);
          if (lit === lastLit) return;
          lastLit = lit;
          for (var i = 0; i < segs.length; i++) {
            segs[i].style.background = (i < lit) ? ORANGE : DEAD;
          }
          runway.textContent = String(lit);
          read.textContent = String(lit);
        }
      }, EX_AT);

      /* 5.62 -> 6.00 : three segments left, and the frame holds still. */

      window.__timelines["04-books"] = tl;
    })();
  </script>
