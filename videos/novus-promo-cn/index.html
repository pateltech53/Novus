<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #232019;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="36.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-cold-open"
        class="scene"
        data-composition-id="01-cold-open"
        data-composition-src="compositions/frames/01-cold-open.html"
        data-start="0"
        data-duration="5.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-intro"
        class="scene"
        data-composition-id="02-intro"
        data-composition-src="compositions/frames/02-intro.html"
        data-start="5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-advance"
        class="scene"
        data-composition-id="03-advance"
        data-composition-src="compositions/frames/03-advance.html"
        data-start="10"
        data-duration="7"
        data-track-index="0"
      ></div>

      <div
        id="el-04-books"
        class="scene"
        data-composition-id="04-books"
        data-composition-src="compositions/frames/04-books.html"
        data-start="16.5"
        data-duration="6.4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-year-gate"
        class="scene"
        data-composition-id="05-year-gate"
        data-composition-src="compositions/frames/05-year-gate.html"
        data-start="22.5"
        data-duration="8.4"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="30.5"
        data-duration="6"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/bed.mp3"
        data-start="0"
        data-duration="36.5"
        data-track-index="11"
        data-volume="0.62"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-cold-open", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 5);
        tl.fromTo("#el-02-intro", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 5);
        tl.to("#el-02-intro", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 10);
        tl.fromTo("#el-03-advance", { x: 1080, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 10);
        tl.to("#el-03-advance", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 16.5);
        tl.fromTo("#el-04-books", { x: 1080, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 16.5);
        tl.to("#el-04-books", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 22.5);
        tl.fromTo("#el-05-year-gate", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 22.5);
        tl.to("#el-05-year-gate", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 30.5);
        tl.fromTo("#el-06-cta", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 30.5);
        tl.to({}, { duration: 36.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
