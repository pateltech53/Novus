<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10.24"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-buildup"
        class="frame"
        data-composition-id="01-buildup"
        data-composition-src="compositions/frames/01-buildup.html"
        data-start="0"
        data-duration="5.46"
        data-track-index="1"
      ></div>

      <div
        id="el-02-bite-cta"
        class="frame"
        data-composition-id="02-bite-cta"
        data-composition-src="compositions/frames/02-bite-cta.html"
        data-start="5.46"
        data-duration="4.78"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio id="el-bgm" src="assets/bgm.mp3" data-start="0" data-duration="10.24"
        data-track-index="11" data-volume="0.9"></audio>

      <!-- SFX: bite chomp landing exactly on the 5.46s beat drop -->
      <audio id="el-sfx-bite" src="assets/sfx/bite.wav" data-start="5.46" data-duration="0.9"
        data-track-index="12" data-volume="0.85"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
