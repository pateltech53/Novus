  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var W = 1920,
        H = 1080;
      // hero card geometry — must mirror the .f03ps-card CSS
      var CARD_W = 1459.2,
        CARD_H = 820.8,
        CARD_L = 230.4,
        CARD_T = 76;
      var SC = CARD_W / 1920; // image px -> canvas px

      // named regions measured on assets/04-play.png (1920x1080 image px)
      var REGIONS = {
        mascot: { l: 420, t: 24, w: 296, h: 278, s: 1.18 },
        rings: { l: 445, t: 296, w: 250, h: 104, s: 1.18 },
        ledger: { l: 756, t: 28, w: 750, h: 100, s: 1.15 },
      };

      // position an annotation element in % of the card (card aspect == image aspect)
      function place(id, l, t, w, h) {
        var el = document.getElementById(id);
        el.style.left = (l / 1920) * 100 + "%";
        el.style.top = (t / 1080) * 100 + "%";
        el.style.width = (w / 1920) * 100 + "%";
        el.style.height = (h / 1080) * 100 + "%";
      }

      // outline boxes: region expanded by 10 image px
      var PAD = 10;
      ["mascot", "rings", "ledger"].forEach(function (k) {
        var r = REGIONS[k];
        place("f03ps-out-" + k, r.l - PAD, r.t - PAD, r.w + 2 * PAD, r.h + 2 * PAD);
      });

      // ring label chips (ring centers x = 483 / 567 / 651, just under the app card edge)
      place("f03ps-chip-brand", 483 - 58, 414, 116, 36);
      place("f03ps-chip-quality", 567 - 58, 414, 116, 36);
      place("f03ps-chip-morale", 651 - 58, 414, 116, 36);

      // ledger figure underlines (under each tile's numeral)
      place("f03ps-under-cash", 772, 96, 46, 4);
      place("f03ps-under-burn", 956, 88, 58, 4);
      place("f03ps-under-runway", 1143, 96, 42, 4);
      place("f03ps-under-valuation", 1326, 88, 46, 4);

      // coordinate-target-zoom: nested wrappers, T = -offset (scale-independent)
      function counterOf(r) {
        var cx = CARD_L + (r.l + r.w / 2) * SC;
        var cy = CARD_T + (r.t + r.h / 2) * SC;
        return { x: -(cx - W / 2), y: -(cy - H / 2) };
      }
      var cMascot = counterOf(REGIONS.mascot);
      var cRings = counterOf(REGIONS.rings);
      var cLedger = counterOf(REGIONS.ledger);

      var EASE = "power3.inOut";

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0–1.1s) · "This is your company." — kicker + card rise ── */
      tl.fromTo(
        "#f03ps-kicker",
        { y: 14, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" },
        0.12
      );
      tl.fromTo(
        "#f03ps-card",
        { y: 110, scale: 0.965, autoAlpha: 0 },
        { y: 0, scale: 1, autoAlpha: 1, duration: 0.95, ease: "power3.out" },
        0.15
      );

      /* ── Scene 2 (1.1–2.86s) · "Your mascot, up top." — zoom + ink outline ── */
      tl.to("#f03ps-zoutr", { scale: REGIONS.mascot.s, duration: 1.0, ease: EASE }, 1.3);
      tl.to("#f03ps-zinr", { x: cMascot.x, y: cMascot.y, duration: 1.0, ease: EASE }, 1.3);
      tl.fromTo(
        "#f03ps-rect-mascot",
        { strokeDashoffset: 100 },
        { strokeDashoffset: 0, duration: 0.75, ease: "power2.inOut" },
        1.75
      );

      /* ── Scene 3 (2.86–5.74s) · "Three rings — brand, quality, morale." ── */
      tl.to("#f03ps-grp-mascot", { opacity: 0.3, duration: 0.4, ease: "power2.out" }, 2.95);
      tl.to("#f03ps-zoutr", { scale: REGIONS.rings.s, duration: 0.9, ease: EASE }, 2.95);
      tl.to("#f03ps-zinr", { x: cRings.x, y: cRings.y, duration: 0.9, ease: EASE }, 2.95);
      tl.fromTo(
        "#f03ps-rect-rings",
        { strokeDashoffset: 100 },
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" },
        3.4
      );
      tl.fromTo(
        "#f03ps-chip-brand",
        { y: 12, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" },
        3.7
      );
      tl.fromTo(
        "#f03ps-chip-quality",
        { y: 12, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" },
        4.4
      );
      tl.fromTo(
        "#f03ps-chip-morale",
        { y: 12, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" },
        5.22
      );

      /* ── Scene 4 (6.1–8.36s) · "And the books: cash, burn, runway, valuation." ── */
      tl.to("#f03ps-grp-rings", { opacity: 0.3, duration: 0.4, ease: "power2.out" }, 6.15);
      tl.to("#f03ps-zoutr", { scale: REGIONS.ledger.s, duration: 1.0, ease: EASE }, 6.15);
      tl.to("#f03ps-zinr", { x: cLedger.x, y: cLedger.y, duration: 1.0, ease: EASE }, 6.15);
      tl.fromTo(
        "#f03ps-rect-ledger",
        { strokeDashoffset: 100 },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" },
        6.7
      );
      var underCues = [
        ["#f03ps-under-cash", 6.95],
        ["#f03ps-under-burn", 7.28],
        ["#f03ps-under-runway", 7.6],
        ["#f03ps-under-valuation", 7.95],
      ];
      underCues.forEach(function (c) {
        tl.fromTo(
          c[0],
          { scaleX: 0, transformOrigin: "0% 50%" },
          { scaleX: 1, duration: 0.32, ease: "power3.out" },
          c[1]
        );
      });

      /* ── Scene 5 (8.86–11.072s) · "Real words…" — pull back to 1x, outlines gone, hold ── */
      tl.to("#f03ps-grp-mascot", { autoAlpha: 0, duration: 0.45, ease: "power2.out" }, 8.95);
      tl.to("#f03ps-grp-rings", { autoAlpha: 0, duration: 0.45, ease: "power2.out" }, 8.95);
      tl.to("#f03ps-grp-ledger", { autoAlpha: 0, duration: 0.45, ease: "power2.out" }, 8.95);
      tl.to("#f03ps-zoutr", { scale: 1, duration: 1.35, ease: EASE }, 8.95);
      tl.to("#f03ps-zinr", { x: 0, y: 0, duration: 1.35, ease: EASE }, 8.95);

      // pad the timeline to the locked frame duration (held read)
      tl.set("#f03ps-kicker", { autoAlpha: 1 }, 11.07);

      window.__timelines["03-play-screen"] = tl;
    })();
  </script>
