  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 5.632;
      var PIVOT = 3.0; /* clip window ends here; the weight-transfer starts here */

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["04-live-with-it"] = tl;

      /* ---------- Scene 1 (0.0-1.0) "Live with it." ----------
         The device rises into place; the screen lights (clip window opens) at 0.5
         with one crest glint. After that, the clip IS the motion. */
      tl.fromTo(
        "#nv04-device",
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.05
      );
      var kchars = document.querySelectorAll("#nv04-kicker .nv04-kc");
      kchars.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 9 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          0.1 + i * 0.03
        );
      });
      /* screen-on glint, finite, synced to the clip window opening */
      var PANE_W = 528 - 48;
      tl.fromTo("#nv04-glintrail", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, 0.5);
      tl.fromTo(
        "#nv04-glint",
        { x: -0.25 * PANE_W },
        { x: 1.05 * PANE_W, duration: 0.38, ease: "power1.inOut" },
        0.5
      );
      tl.to("#nv04-glintrail", { opacity: 0, duration: 0.14, ease: "power1.in" }, 0.76);

      /* ---------- Scene 2 (1.0-2.9) "Suppliers squeeze. Rivals copy." ----------
         Two pressure lines flank the device, one per spoken cue; each red tick
         draws in (svg-path-draw: measured dash, power2.out). */
      ["nv04-tick-l", "nv04-tick-r"].forEach(function (id) {
        var p = document.getElementById(id);
        var len = p.getTotalLength() * 1.05;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      tl.to("#nv04-tick-l", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.95);
      document.querySelectorAll("#nv04-press-l .nv04-pw").forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
          1.05 + i * 0.1
        );
      });
      tl.to("#nv04-tick-r", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.95);
      document.querySelectorAll("#nv04-press-r .nv04-pw").forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
          2.05 + i * 0.1
        );
      });

      /* ---------- Scene 3 (3.0-4.35) "And every call you make —" ----------
         Signature weight-transfer, one event: the clip window closes on this exact
         beat, a commit flash seals the screen, the white check draws (the call,
         committed), and the device slides aside left at 0.8 into the space the
         typing line now fills. */
      tl.to(
        "#nv04-device",
        { x: -538, scale: 0.8, duration: 0.6, ease: "power3.inOut" },
        PIVOT
      );
      tl.fromTo("#nv04-flash", { opacity: 0 }, { opacity: 0.3, duration: 0.08, ease: "power1.out" }, PIVOT);
      tl.to("#nv04-flash", { opacity: 0, duration: 0.32, ease: "power2.out" }, PIVOT + 0.08);
      var check = document.getElementById("nv04-check-p");
      var clen = check.getTotalLength() * 1.05;
      check.style.strokeDasharray = String(clen);
      check.style.strokeDashoffset = String(clen);
      tl.to(check, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, PIVOT + 0.1);
      /* chrome and pressure lines demote — the noise recedes under the glass */
      tl.to("#nv04-kicker", { opacity: 0.3, duration: 0.5, ease: "power2.inOut" }, PIVOT);
      tl.to("#nv04-press-l", { opacity: 0.12, x: -56, duration: 0.5, ease: "power2.inOut" }, PIVOT);
      tl.to("#nv04-press-r", { opacity: 0.12, x: 44, duration: 0.5, ease: "power2.inOut" }, PIVOT);

      /* ---------- Scene 4 (4.35-end) "compounds." ----------
         counting-dynamic-scale register on type: final size is static CSS, only
         the transform grows (deceleration, no bounce); then the gold sweep. */
      tl.to("#nv04-typed", { opacity: 0.75, duration: 0.3, ease: "power2.out" }, 4.42);
      tl.fromTo("#nv04-h1", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 4.42);
      tl.fromTo(
        "#nv04-h1",
        { scale: 0.55 },
        { scale: 1, duration: 0.65, ease: "power3.out" },
        4.42
      );
      tl.fromTo(
        "#nv04-gold",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        4.95
      );

      /* ---------- driver: discrete typing, caret blink, post-pivot breath ---------- */
      var T0 = 3.3; /* first keystroke */
      var SEQUENCE = [
        { t: 0.0, text: "" },
        { t: T0, text: "E" },
        { t: 3.38, text: "EV" },
        { t: 3.44, text: "EVE" },
        { t: 3.52, text: "EVERY" },
        { t: 3.66, text: "EVERY C" },
        { t: 3.74, text: "EVERY CA" },
        { t: 3.8, text: "EVERY CALL" },
        { t: 3.96, text: "EVERY CALL Y" },
        { t: 4.02, text: "EVERY CALL YO" },
        { t: 4.08, text: "EVERY CALL YOU" },
        { t: 4.2, text: "EVERY CALL YOU MA" },
        { t: 4.26, text: "EVERY CALL YOU MAK" },
        { t: 4.32, text: "EVERY CALL YOU MAKE" }
      ];
      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }
      var textEl = document.getElementById("nv04-text");
      var caretEl = document.getElementById("nv04-caret");
      var paneEl = document.getElementById("nv04-pane");
      var CARET_ON = 3.25;
      var CARET_OFF = 4.42; /* the input commits as the consequence lands */
      var BREATH_AT = 3.8;

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var t = driver.t;
            textEl.textContent = textAt(t);
            var on =
              t >= CARET_ON &&
              t < CARET_OFF &&
              Math.sin(((t - CARET_ON) / 0.6) * Math.PI * 2 + 0.6) > -0.25;
            caretEl.style.opacity = on ? "1" : "0";
            /* gentle y-bob only after the clip has yielded — never while aligned */
            if (t > BREATH_AT) {
              var amp = 2.5 * Math.min(1, (t - BREATH_AT) / 0.7);
              var y = amp * Math.sin((t - BREATH_AT) * Math.PI * 2 * 0.55);
              paneEl.style.transform = "translateY(" + y.toFixed(2) + "px)";
            } else {
              paneEl.style.transform = "translateY(0px)";
            }
          }
        },
        0
      );
    })();
  </script>
