    <script>
      (function () {
        var ID = "07-the-gate";
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;

        var camera = document.getElementById("f07gate-camera");
        var counter = document.getElementById("f07gate-counter");
        var digits = document.getElementById("f07gate-digits");
        var tens = document.getElementById("f07gate-d-tens");

        var bar = document.getElementById("f07gate-bar");
        var device = document.getElementById("f07gate-device");
        var glint = document.getElementById("f07gate-glint");
        var words = document.querySelectorAll("#f07gate-gateline .f07gate-w");
        var blurNode = document.getElementById("f07gate-streak-blur");

        /* ---- multi-phase camera: one writer for phase scale + drift + slam shake ---- */
        var phase = { scale: 0.97 };
        var drift = { p: 0 };
        var shake = { p: 0, amp: 0 };
        var writeCamera = function () {
          var dx = Math.sin(drift.p) * 5;
          var dy = Math.sin(drift.p * 1.3) * 3 + Math.sin(shake.p) * shake.amp;
          camera.style.transform = "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
        };
        writeCamera(); /* seed frame 0 */

        /* phase 2 — settle to neutral during the count */
        tl.to(phase, { scale: 1.0, duration: 1.1, ease: "power2.out" }, 0.1);
        /* phase 3 — slow push under the gate-line reveal */
        tl.to(phase, { scale: 1.045, duration: 0.93, ease: "power2.inOut" }, 3.1);
        /* impact shake on the slam at "stops" (1.17s) */
        tl.to(shake, { p: Math.PI * 5, duration: 0.34, ease: "none" }, 1.17);
        tl.to(shake, { amp: 7, duration: 0.06, ease: "power2.out" }, 1.17);
        tl.to(shake, { amp: 0, duration: 0.28, ease: "power2.out" }, 1.23);
        /* drift driver spans the whole composition — the ONE transform writer */
        tl.to(drift, { p: Math.PI * 2 * 1.2, duration: 4.032, ease: "none", onUpdate: writeCamera }, 0);

        /* ---- Scene 1 (0.0–1.17): "Then month twelve" — count 01→12, accelerating ---- */
        var val = { v: 1 };
        var setDigits = function () {
          var n = Math.round(val.v);
          tens.textContent = String(Math.floor(n / 10));
          ones.textContent = String(n % 10);
        };
        setDigits(); /* seed "01" */
        tl.fromTo(month, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.07);
        /* value + scale share window and ease (counting-dynamic-scale); .in = accelerating ticks into the slam */
        tl.to(val, { v: 12, duration: 1.07, ease: "power2.in", onUpdate: setDigits }, 0.1);
        tl.fromTo(digits, { scale: 0.55 }, { scale: 1, duration: 1.07, ease: "power2.in" }, 0.1);

        /* ---- Scene 2 (1.17–2.27): SLAM on "stops" + gold underline sweep, then dead-still ---- */
        tl.to(digits, { scale: 1.07, duration: 0.07, ease: "power2.in" }, 1.17);
        tl.to(digits, { scale: 1, duration: 0.24, ease: "power3.out" }, 1.24);
        tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 1.17);

        /* ---- Scene 3 (2.27–3.09): "To close the year" — push THROUGH the digits ---- */
        var blur = { v: 0 };

          blurNode.setAttribute("stdDeviation", blur.v * 0.6 + " " + blur.v);

        writeBlur(); /* seed 0 — the streak lives mid-shot, not at t=0 */
        tl.to(counter, { scale: 8, duration: 0.75, ease: "power3.in" }, 2.27);
        /* light blur riding the same window/ease — legible, no white flash */
        tl.to(blur, { v: 9, duration: 0.75, ease: "power2.in", onUpdate: writeBlur }, 2.27);
        tl.to(counter, { opacity: 0, duration: 0.28, ease: "power1.in" }, 2.62);
        /* the gate screen arrives centered — inverse side of the zoom-through seam */
        tl.fromTo(device, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.35);
        tl.fromTo(device, { scale: 0.62 }, { scale: 1, duration: 0.7, ease: "expo.out" }, 2.35);

        /* ---- Scene 4 (3.1–4.032): "you have to pitch" — gate line word-by-word + capsule brighten ---- */
        var wordAt = [3.1, 3.21, 3.32, 3.43, 3.54, 3.65];
