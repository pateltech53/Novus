    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["07-the-gate"] = tl;

        /* ── VO map (audio_meta line 07, 4.032s) ──
           "then month 12"      0.07–1.17  → count 01→12, accelerating
           "stops the clock."   1.17–2.20  → slam + gold bloom, dead-still beat
           "To close the year," 2.27–3.09  → push THROUGH the digits, gate arrives
           "you have to pitch." 3.14–4.02  → gate line word-by-word, capsule at "pitch" */

        /* ── Scene 1: counting-dynamic-scale (accelerating tick 01→12) ── */
        const digits = document.getElementById("f07-digits");
        const state = { v: 1 };
        tl.fromTo("#f07-camA", { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 0);
        tl.fromTo(
          "#f07-month-label",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.05
        );
        tl.fromTo(
          state,
          { v: 1 },
          {
            v: 12,
            duration: 1.08,
            ease: "power1.in",
            onUpdate: () => {
              digits.textContent = String(Math.round(state.v)).padStart(2, "0");
            },
          },
          0.07
        );
        /* scale grows on the same window + ease — weight escalates with the count */
        tl.fromTo(
          "#f07-count",
          { scale: 0.6 },
          { scale: 1, duration: 1.08, ease: "power1.in" },
          0.07
        );

        /* ── Scene 2: the SLAM on "stops" (1.17) + restrained prestige bloom ── */
        tl.fromTo(
          "#f07-count",
          { scale: 1 },
          { scale: 1.13, duration: 0.09, ease: "power2.in" },
          1.17
        );
        tl.to("#f07-count", { scale: 1, duration: 0.28, ease: "power3.out" }, 1.26);
        tl.to("#f07-month-label", { color: "#FFC24B", duration: 0.2, ease: "none" }, 1.17);
        /* ambient-glow-bloom, pulse-on-arrival: peak 0.34 (≤0.38 contrast cap), eases to 0.22 hold */
        tl.fromTo(
          "#f07-bloom",
          { opacity: 0, scale: 0.82 },
          { opacity: 0.34, scale: 1, duration: 0.26, ease: "power2.out" },
          1.17
        );
        tl.to("#f07-bloom", { opacity: 0.22, scale: 1.04, duration: 0.55, ease: "power1.inOut" }, 1.47);
        /* 1.9 → 2.25: dead-still beat — nothing fires */

        /* ── Scene 3: multi-phase-camera push THROUGH the digits (2.25) ── */
        const camA = document.getElementById("f07-camA");
        const pA = { s: 1, d: 0 };
        const writeA = () => {
          const dx = Math.sin(pA.d) * 3;
          const dy = Math.sin(pA.d * 1.3) * 2;
          camA.style.transform = "scale(" + pA.s + ") translate(" + dx + "px," + dy + "px)";
        };
        writeA();
        /* one continuous micro-drift channel — the single transform writer */
        tl.fromTo(
          pA,
          { d: 0 },
          { d: Math.PI * 2, duration: 2.95, ease: "none", onUpdate: writeA },
          0
        );
        /* phase push: through the "12" */
        tl.fromTo(
          pA,
          { s: 1 },
          { s: 13, duration: 0.7, ease: "power3.in", onUpdate: writeA },
          2.25
        );
        tl.fromTo(camA, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, 2.6);

        /* motion-blur-streak, camera-travel carve-out: "B B" depth smear on the wrapper */
        const bA = document.getElementById("f07-fA-blur");
        const pbA = { v: 0 };
        const wbA = () => bA.setAttribute("stdDeviation", pbA.v + " " + pbA.v);
        wbA(); /* seed 0 — sharp until the push */
        tl.fromTo(pbA, { v: 0 }, { v: 16, duration: 0.7, ease: "power3.in", onUpdate: wbA }, 2.25);

        /* gate arrives centered out of the push (inverse zoom-through seam):
           grows from deep, streaked → snaps sharp on the same window/ease */
        const camB = document.getElementById("f07-camB");
        tl.fromTo(
          camB,
          { scale: 0.36 },
          { scale: 1, duration: 0.75, ease: "expo.out" },
          2.45
        );
        tl.fromTo(camB, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.45);
        const bB = document.getElementById("f07-fB-blur");
        const pbB = { v: 14 };
        const wbB = () => bB.setAttribute("stdDeviation", pbB.v + " " + pbB.v);
        wbB(); /* seed at peak — the arrival's first frame is its fastest */
        tl.fromTo(pbB, { v: 14 }, { v: 0, duration: 0.75, ease: "expo.out", onUpdate: wbB }, 2.45);

        /* ── Scene 4: "you have to pitch." (3.14) — gate line word-by-word ── */
        gsap.utils.toArray(".f07-gw").forEach((w, i) => {
          tl.fromTo(
            w,
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" },
            3.14 + i * 0.07
          );
        });
        /* gentle settle push under the reveal — keeps the back half alive */
        tl.to(camB, { scale: 1.02, duration: 0.78, ease: "sine.inOut" }, 3.25);
        /* the OPEN THE CAMERA capsule brightens once on "pitch" (3.67), settles lit */
        tl.fromTo(
          "#f07-capsule-glow",
          { opacity: 0 },
          { opacity: 0.5, duration: 0.12, ease: "power2.out" },
          3.67
        );
        tl.to("#f07-capsule-glow", { opacity: 0.15, duration: 0.3, ease: "power2.out" }, 3.79);
      })();
