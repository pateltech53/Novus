  </style>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 5.248;
      /* Storyboard scenes were drafted on a ~9s grid; real VO is 5.248s —
         windows mapped proportionally (x0.583):
         S1 0-0.70 · S2 0.70-1.98 · S3 1.98-3.85 · S4 3.85-5.248 */

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["03-run-it"] = tl;

      /* ---------- Scene 1 (0-0.70): device rises from the bottom edge, long-tail settle ---------- */
      tl.fromTo(
        "#nv03-device",
        { y: 1040 },
        { y: 0, duration: 0.68, ease: "power3.out" },
        0.04
      );
      /* vignette deepens behind the device */
      tl.fromTo("#nv03-deepen", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.15);
      /* kicker lands top-left */
      tl.fromTo(
        "#nv03-kicker",
        { opacity: 0, y: 14, scale: 1.05 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        0.15
      );

      /* ---------- Scene 2 (0.70-1.98): word-chips, one per spoken cue ----------
         dynamic-content-sequencing: starts reduced once from content length */
      var W_BASE = 0.3;
      var W_SPC = 0.014;
      var wordText = ["hiring", "pricing", "product"];
      var cum = 0.78;
      var wordStarts = wordText.map(function (w) {
        var s = cum;
        cum += W_BASE + w.length * W_SPC;
        return s;
      });
      var wordEls = document.querySelectorAll("#nv03-words .nv03-wordchip");
      wordEls.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 16, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "power3.out" },
          wordStarts[i]
        );
      });

      /* ---------- Scene 3 (1.98-3.85): ledger chips lift off the screen ----------
         scale-swap-transition per chip (echo = outgoing, glass chip = incoming),
         then counting-dynamic-scale on the figure */
      /* word-chips demote to 40% as the ledger takes focus */
      tl.to("#nv03-words", { opacity: 0.4, duration: 0.4, ease: "power2.out" }, 2.0);

      var EXIT_DUR = 0.3;
      var OVERLAP = 0.15;
      var ENTER_DUR = 0.5;
      var COUNT_DUR = 0.72;
      var START_SCALE = 0.55;

      var CHIPS = [
        { T: 2.02, echo: "#nv03-echo-cash", chip: "#nv03-chip-cash", fig: "nv03-fig-cash", target: 25, meta: ["#nv03-meta-cash", "#nv03-pre-cash"], suffix: "#nv03-suf-cash" },
        { T: 2.62, echo: "#nv03-echo-burn", chip: "#nv03-chip-burn", fig: "nv03-fig-burn", target: 2000, meta: ["#nv03-meta-burn", "#nv03-pre-burn"], suffix: null },
        { T: 3.18, echo: "#nv03-echo-run", chip: "#nv03-chip-run", fig: "nv03-fig-run", target: 12, meta: ["#nv03-meta-run"], suffix: "#nv03-suf-run" }
      ];

      CHIPS.forEach(function (c) {
        var T = c.T;
        /* outgoing: ghost tile flashes on the screen, then shrinks + fades (power2.in) */
        tl.fromTo(c.echo, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, T - 0.06);
        tl.to(c.echo, { scale: 0.78, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, T + 0.08);

        /* incoming: glass chip pops in from the device's direction (back.out) */
        tl.fromTo(
          c.chip,
          { opacity: 0, scale: 0.7, x: 70 },
          { opacity: 1, scale: 1, x: 0, duration: ENTER_DUR, ease: "back.out(1.6)" },
          T + 0.08 + EXIT_DUR - OVERLAP
        );

        /* inner content after the container settles: label + prefix first */
        c.meta.forEach(function (sel) {
          tl.fromTo(sel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, T + 0.42);
        });

        /* the count: value + scale share position and ease (no bounce on data) */
        var figEl = document.getElementById(c.fig);
        var state = { value: 0 };
        tl.to(
          state,
          {
            value: c.target,
            duration: COUNT_DUR,
            ease: "power3.out",
            onUpdate: function () {
              figEl.textContent = Math.round(state.value).toLocaleString("en-US");
            }
          },
          T + 0.55
        );
        tl.fromTo(
          figEl,
          { scale: START_SCALE },
          { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
          T + 0.55
        );

        /* suffix slides in only after the count lands — the number gets its own beat */
        if (c.suffix) {
          tl.fromTo(
            c.suffix,
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.26, ease: "back.out(1.7)" },
            T + 0.55 + COUNT_DUR
          );
        }
      });

      /* ---------- Scene 4 (3.85-5.248): lead line per word; device holds still ----------
         (months.mp4 takes over the device face at 3.9 via the hoisted video clip) */
      var L_BASE = 0.06;
      var L_SPC = 0.008;
      var leadText = ["Your", "whole", "company,", "one", "month", "at", "a", "time."];
      var lcum = 3.95;
      var leadStarts = leadText.map(function (w) {
        var s = lcum;
        lcum += L_BASE + w.length * L_SPC;
        return s;
      });
      var leadEls = document.querySelectorAll("#nv03-lead .nv03-lw");
      leadEls.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
          leadStarts[i]
        );
      });
    })();
  </script>
