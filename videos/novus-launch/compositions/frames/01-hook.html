<template>
  <style>
    @font-face {
      font-family: "Urbanist";
      src: url(assets/fonts/Urbanist-Variable.woff2) format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      container-type: size;
      font-family: "Urbanist", sans-serif;
    }

    /* ---- full-bleed navy stage — the licensed brand vignette ---- */
    .hook-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 105% at 50% 42%, #10263f 0%, #0b1e36 52%, #081527 100%);
    }

    .hook-stage {
      position: absolute;
      inset: 0;
    }

    /* macro camera — slow push underneath everything */
    #hook-cam {
      position: absolute;

    /* ---- the fixed sentence stack (Scenes 1-3) ---- */
    #hook-stack {

    .hook-w {
      display: inline-block;
      will-change: transform, opacity, filter;
    }
    /* the variable slot — slightly brighter than the fixed frame */
    #hook-slotwrap {
      color: #ffffff;
      min-width: 42cqw; /* >= widest state ("memorize") — frame never moves */
    }

    /* ---- the payoff (Scene 4) ---- */
    #hook-payoff {
      position: absolute;
      inset: 0 0 9cqh 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 29cqw;
    }
    /* ambient glow — behind the hero, darker + more saturated than #FF6B00 */
    #hook-glow {
      position: absolute;
      z-index: 1;
      left: 20cqw;
      width: 66cqw;
      top: 26%;
      height: 62%; /* box bottom stays above the 83% keep-out */
      background: radial-gradient(
        closest-side,
        rgba(224, 84, 0, 0.75) 0%,
        rgba(224, 84, 0, 0.22) 48%,
        rgba(224, 84, 0, 0) 74%
      );
      opacity: 0;
    }
    #hook-p1 {
      position: relative;
      z-index: 2;
      width: max-content;
      font-size: 9cqw;

    #hook-p2 {
      position: relative;

      font-weight: 800;

      color: #ff6b00; /* action — the frame's single action-colored element */
      will-change: transform, opacity, filter;

  </style>

  <div id="root" data-composition-id="01-hook" data-duration="5.157" data-width="1920" data-height="1080">
    <div class="clip hook-bg" data-start="0" data-duration="5.157" data-track-index="0"></div>

    <div class="clip hook-stage" data-start="0" data-duration="5.157" data-track-index="1">
      <div id="hook-cam">
        <div id="hook-stack">
          <div class="hook-row">
            <span class="hook-w" id="hook-w-you">you</span>
            <span class="hook-w" id="hook-w-can">can</span>
          </div>
          <div class="hook-row">
            <span class="hook-w" id="hook-slotwrap" data-layout-allow-overlap><span id="hook-slot">watch</span></span>
          </div>
          <div class="hook-row">
            <span class="hook-w" id="hook-w-biz">business.</span>
          </div>
        </div>

        <div id="hook-payoff">
          <div id="hook-glow"></div>
          <div id="hook-p1" data-layout-allow-overlap>or you can</div>
          <div id="hook-p2" data-layout-allow-overlap>run one.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (() => {
      const D = 4.757;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;

      /* ── macro camera: one slow push under the whole shot ─────────── */
      tl.fromTo("#hook-cam", { scale: 1 }, { scale: 1.035, duration: D, ease: "none" }, 0);

      /* ── Scene 1 (0-1.4s): per-word staggered reveal, long-tail settle.
             Onsets are the VO's own word timings (content-driven sequencing):
             you 0.10 / can 0.21 / watch 0.42 / business 0.79 ─────────── */
      const WORD_IN = [
        ["#hook-w-you", 0.08],
        ["#hook-w-can", 0.2],
        ["#hook-slotwrap", 0.4],
        ["#hook-w-biz", 0.76],
      ];
      WORD_IN.forEach(([sel, at]) => {
        tl.fromTo(
          sel,
          { y: 70, opacity: 0, filter: "blur(8px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out" },
          at,
        );
      });

      /* ── Scene 2 (1.4-3.3s): discrete-text-sequence — instant in-place
             word swaps, each landing exactly on its spoken cue ────────── */
      const SLOT_SEQ = [
        { t: 0.0, text: "watch" },
        { t: 1.62, text: "read" }, // VO "read" @ 1.62
        { t: 2.35, text: "memorize" }, // VO "memorize" @ 2.35
      ];
      const slotAt = (time) => {
        for (let i = SLOT_SEQ.length - 1; i >= 0; i--) {
          if (time >= SLOT_SEQ[i].t) return SLOT_SEQ[i].text;
        }
        return SLOT_SEQ[0].text;
      };
      const slotEl = document.getElementById("hook-slot");
      const driver = { t: 0 };
      let lastText = null;
      tl.to(
        driver,
        {
          t: D,
          duration: D,
          ease: "none",
          onUpdate: () => {
            const txt = slotAt(driver.t);
            if (txt !== lastText) {
              slotEl.textContent = txt; // hard cut — swap only on transition
              lastText = txt;
            }
          },
        },
        0,
      );

      /* ── Scene 3 (3.3-3.78s): waterfall clear upward — per-word
             pronounced power4.in ramp, early fade, reading-order stagger;
             then a beat of empty navy (the pause carries the weight) ──── */
      const CLEAR = 3.3;
      ["#hook-w-you", "#hook-w-can", "#hook-slotwrap", "#hook-w-biz"].forEach((sel, i) => {
        const at = CLEAR + i * 0.022;
        tl.to(sel, { y: -230, duration: 0.34, ease: "power4.in" }, at);
        tl.to(sel, { opacity: 0, duration: 0.18, ease: "power1.in" }, at);
      });

      /* ── Scene 4 (3.78s-end): kinetic beat-slam on the VO onset grid ── */
      const BEATS = [3.78, 4.1]; // VO "you (can)" @ 3.74 · "run" @ 4.13

      // phrase 1 — velocity-matched continuation of the upward clear:
      // ignites from below at the waterfall's mirrored ease
      tl.fromTo(
        "#hook-p1",
        { y: 230 },
        { y: 0, duration: 0.45, ease: "power4.out" },
        BEATS[0],
      );
      tl.fromTo(
        "#hook-p1",
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power1.out" },
        BEATS[0],
      );

      // phrase 2 — the slam: scale + blur hit, distinct entrance axis
      tl.fromTo(
        "#hook-p2",
        { scale: 1.5, opacity: 0, filter: "blur(16px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        BEATS[1],
      );

      // ambient glow bloom — lands with the hero's settle as ONE beat,
      // then bloom-and-hold (short hold: no breathe). Peak 0.26 <= 0.45.
      tl.fromTo(
        "#hook-glow",
        { opacity: 0, scale: 0.82 },
        { opacity: 0.26, scale: 1, duration: 0.45, ease: "power2.out" },
        BEATS[1],
      );
      /* settles and holds still — no exit (non-final frame) */
    })();
  </script>
