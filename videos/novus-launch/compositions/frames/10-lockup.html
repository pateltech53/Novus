    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["10-lockup"] = tl;

        /* VO map (audio_meta line 10, 4.395s):
           "Novus,"              0.04–0.67  -> Scene 1: mark draws + wordmark
           "learn by doing."     0.67–1.92  -> Scene 2: tagline appends
           "Start your company"  1.97–2.77  -> Scene 3: pill fills orange
           "at novuspitch.com"   2.90–4.38  -> Scene 4: URL types, caret blinks twice, hold */

        var fin = document.getElementById("f10lockup-fin");
        var wave = document.getElementById("f10lockup-wave");
        var finLen = fin.getTotalLength() * 1.05;
        var waveLen = wave.getTotalLength() * 1.05;
        fin.style.strokeDasharray = finLen;
        fin.style.strokeDashoffset = finLen;
        wave.style.strokeDasharray = waveLen;
        wave.style.strokeDashoffset = waveLen;

        /* the whole chain settles from a barely-larger scale — the near-still Apple push */
        tl.fromTo(
          "#f10lockup-chain",
          { scale: 1.03 },
          { scale: 1.0, duration: 4.395, ease: "none" },
          0
        );

        /* --- Scene 1 (0.0–0.67): svg-path-draw — fin strokes then fills, wave strokes through --- */
        tl.to(fin, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 0.02);
        tl.to(fin, { fillOpacity: 1, duration: 0.3, ease: "power1.out" }, 0.34);
        tl.to(wave, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 0.24);
        tl.fromTo(
          "#f10lockup-word",
          { opacity: 0, x: -22 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power1.out" },
          0.3
        );

        /* --- Scene 2 (0.67–1.92): tagline appends — slide-up crossfade, one move --- */
        tl.fromTo(
          "#f10lockup-tagline",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          0.72

        /* --- Scene 3 (1.97–2.77): the glass pill arrives, then fills with action orange --- */
        tl.fromTo(
          "#f10lockup-pill",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          1.9
        );
        tl.to(
          "#f10lockup-pill-fill",
          { scaleX: 1, duration: 0.85, ease: "power2.out" },
          2.08
        );
        /* ink-on-fire flip synced to the fill passing beneath the label */
        tl.to(
          "#f10lockup-pill-label",
          { color: "#111111", duration: 0.28, ease: "power1.inOut" },
          2.2
        );

        /* --- Scene 4 (2.90–4.38): discrete-text-sequence URL + caret, then the hold --- */
        var SEQUENCE = [
          { t: 0.0, text: "" },
          { t: 2.95, text: "n" },
          { t: 3.06, text: "no" },
          { t: 3.14, text: "nov" },
          { t: 3.24, text: "novus" },
          { t: 3.38, text: "novusp" },
          { t: 3.47, text: "novuspit" },
          { t: 3.56, text: "novuspitch" },
          { t: 3.74, text: "novuspitch." },
          { t: 3.84, text: "novuspitch.c" },
          { t: 3.92, text: "novuspitch.com" },
        ];
        function textAt(time) {
          for (var i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
          }
          return "";
        }
        /* caret: hidden -> solid while typing -> two sin-wave blinks -> off (the stop) */
        function caretAt(time) {
          if (time < 2.88) return 0;
          if (time < 3.95) return 1;
          if (time < 4.35) {
            var p = ((time - 3.95) / 0.4) * Math.PI * 4; /* two full cycles */
            return Math.sin(p) > 0 ? 1 : 0;
          }
          return 0;
        }

        var urlEl = document.getElementById("f10lockup-url-text");
        var caretEl = document.getElementById("f10lockup-caret");
        var driver = { t: 0 };
        tl.to(

            duration: 4.395,
            ease: "none",

              urlEl.textContent = textAt(driver.t);
              caretEl.style.opacity = String(caretAt(driver.t));
            },
          },
          0
        );
