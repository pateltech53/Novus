      var DUR = 6.059;

      var tl = gsap.timeline({ paused: true });
      window.__timelines["09-lockup"] = tl;

      /* The packet's Scene windows (0-9s) are compressed onto the locked
         6.059s duration, keyed to the VO cues:
         S1 0.00-1.50  "Novus."                     — the mark draws itself on
         S2 1.50-3.85  "Keep a company alive. Defend it out loud."
         S3 3.85-4.55  "Play free at"               — the orange capsule
         S4 4.45-6.059 "novuspitch dot com"         — the URL, then dead still */

      /* ---------- macro move: one slow settle, decelerating into the Apple hold ---------- */
      tl.fromTo(
        "#nv09-zoom",
        { scale: 1.016 },
        { scale: 1, duration: 4.8, ease: "power1.out" },
        0
      );

      /* ---------- Scene 1 (0.0-1.5): the glass pane materializes on the empty stage ---------- */
      tl.fromTo(
        "#nv09-pane",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.04
      );

      /* the mark self-draws stroke-by-stroke (svg-path-draw: measured dash,
         staggered so the eye reads one continuous pen) */
      var DRAW_ORDER = [
        "nv09-p1", "nv09-p2", "nv09-p3", "nv09-p4", "nv09-p5",
        "nv09-p6", "nv09-ps", "nv09-p8", "nv09-p9"
      ];
      var DRAW_START = 0.22;
      var SEG_DUR = 0.3;
      var SEG_STAGGER = 0.1;
      DRAW_ORDER.forEach(function (id, i) {
        var p = document.getElementById(id);
        var len = p.getTotalLength() * 1.05;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        var at = DRAW_START + i * SEG_STAGGER;
        tl.to(p, { strokeDashoffset: 0, duration: SEG_DUR, ease: "power2.out" }, at);
        if (p.classList.contains("nv09-mp")) {
          /* draw-then-fill: the fill fades only after this segment's stroke lands */
          tl.to(p, { fillOpacity: 1, duration: 0.25, ease: "power1.out" }, at + SEG_DUR * 0.95);
        }
      });

      /* companion name fades in only after the last stroke settles */
      tl.fromTo(
        "#nv09-name",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.4
      );

      /* ---------- Scene 2 (1.5-3.85): taglines per-word, one line per spoken cue ---------- */
      var BASE = 0.1;
      var SEC_PER_CHAR = 0.03;
      function wordStarts(words, phraseStart) {
        var cum = phraseStart;
        return words.map(function (w) {
          var start = cum;
          cum += BASE + w.length * SEC_PER_CHAR;
          return start;
        });
      }
      /* line 1 on "Keep a company alive." (~1.58s), line 2 on "Defend it out loud." (~2.62s) */
      var starts = wordStarts(["keep", "a", "company", "alive."], 1.58).concat(
        wordStarts(["defend", "it", "out", "loud."], 2.62)
      );
      var wordEls = document.querySelectorAll(".nv09-tl .nv09-w");
      wordEls.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
          starts[i]

      /* the lockup completes as a unit: ONE finite specular glint crosses the mark */
      var PANE_W = 0.34 * 1920; /* pane width in px */
      var GLINT_AT = 3.35;
      var GLINT_SWEEP = 0.5;
      tl.fromTo(
        "#nv09-glintwrap",
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: "power1.out" },
        GLINT_AT
      );
      tl.fromTo(
        "#nv09-glintmove",
        { x: -0.35 * PANE_W },
        { x: 1.15 * PANE_W, duration: GLINT_SWEEP, ease: "power1.inOut" },
        GLINT_AT
      );
      tl.to(
        "#nv09-glintwrap",
        { opacity: 0, duration: 0.16, ease: "power1.in" },
        GLINT_AT + GLINT_SWEEP - 0.14

      /* ---------- Scene 3 (3.85-4.55): the ONE action element arrives ---------- */

        { opacity: 0, y: 20, scale: 0.96 },

      /* stat-bars-and-fills, progress-fill register: scaleX from a left origin */

      /* ---------- Scene 4 (4.45-6.059): discrete-text-sequence URL + caret ---------- */
      tl.fromTo(

        { opacity: 1, duration: 0.2, ease: "power1.out" },

      var SEQUENCE = [

        { t: 4.53, text: "n" },

        for (var i = SEQUENCE.length - 1; i >= 0; i--) {

      var BLINK_START = 5.36;

        var p = ((time - BLINK_START) / BLINK_WINDOW) * Math.PI * 4;
        return Math.sin(p) > 0 ? 0 : 1; /* first half-cycle goes dark = a blink */
