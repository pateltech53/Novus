    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["05-scenarios"] = tl;

        /* ---- svg-path-draw setup: measured lengths, dash fully offset (hidden) ---- */
        ["s05-tick1", "s05-tick2", "s05-ck-ring", "s05-ck-mark"].forEach(function (id) {
          var p = document.getElementById(id);
          var len = p.getTotalLength() * 1.05;
          p.style.strokeDasharray = "" + len;
          p.style.strokeDashoffset = "" + len;
        });

        /* ================= Scene 1 (0.0–2.39) — "Every month brings a real scenario." ================= */
        tl.fromTo("#s05-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.08);
        /* device rises center-frame, settling at exact video geometry by 0.5s (video pops on = screen lights up) */
        tl.fromTo(
          "#s05-device",
          { opacity: 0, y: 64, scale: 0.95 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
          0.05
        );

        /* ================= Scene 2 (2.43–4.96) — pressure lines, one per spoken cue ================= */
        /* "A supplier squeezes," — 2.43s */
        tl.fromTo("#s05-pl1a", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 2.43);
        tl.fromTo("#s05-pl1b", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 2.56);
        tl.to("#s05-tick1", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 2.5);

        /* "a rival copies," — 3.77s */
        tl.fromTo("#s05-pr1a", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 3.77);
        tl.fromTo("#s05-pr1b", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 3.9);
        tl.to("#s05-tick2", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 3.84);

        /* ================= Scene 3 (5.0) — the pivot: clip ends, device slides aside carrying the commit ================= */
        /* signature weight-transfer: one event — slide left + scale 0.8 while the commit flash/check lands on the screen */
        tl.to("#s05-device", { x: -450, scale: 0.8, duration: 0.5, ease: "power3.inOut" }, 4.98);
        tl.to("#s05-flash", { opacity: 0.45, duration: 0.08, ease: "power1.out" }, 5.0);
        tl.to("#s05-flash", { opacity: 0, duration: 0.32, ease: "power2.out" }, 5.08);
        tl.to("#s05-ck-ring", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 5.02);
        tl.to("#s05-ck-mark", { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, 5.18);
        /* pressure lines yield the frame */
        tl.to("#s05-press-l", { opacity: 0.1, x: -46, duration: 0.4, ease: "power2.inOut" }, 4.98);
        tl.to("#s05-press-r", { opacity: 0.08, x: 46, duration: 0.4, ease: "power2.inOut" }, 4.98);

        /* ---- discrete-text-sequence: keystrokes -> pause -> bulk paste; reverse-search each frame ---- */
        var SEQ = [
          { t: 0.0, text: "" },
          { t: 0.06, text: "y" },
          { t: 0.14, text: "yo" },
          { t: 0.24, text: "you" },
          { t: 0.44, text: "you decide." } /* bulk paste lands inside spoken "decide" */
        ];
        function textAt(time) {
          for (var i = SEQ.length - 1; i >= 0; i--) {
            if (time >= SEQ[i].t) return SEQ[i].text;
          }
          return "";
        }
        var textEl = document.getElementById("s05-type-text");
        var driver = { t: 0 };
        tl.to(
          driver,
          {
            t: 0.696,
            duration: 0.696,
            ease: "none",
            onUpdate: function () {
              textEl.textContent = textAt(driver.t);
            }
          },
          5.0
        );

        /* caret blink — deterministic sin square wave on the same timeline; ends visible (Scene 4 hold) */
        var caretEl = document.getElementById("s05-caret");
        var blink = { p: 0 };
        tl.to(
          blink,
          {
            p: Math.PI * 2 * 1.25,
            duration: 0.696,
            ease: "none",
            onUpdate: function () {
              caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
