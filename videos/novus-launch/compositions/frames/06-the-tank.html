    #root {
      position: absolute;
      inset: 0;
      width: 100%;

    /* ---- navy stage ground (licensed vignette) — behind the plate ---- */
    .nv06-bg {

    /* ---- the scene + camera (multi-phase-camera: one unbroken push) ---- */
    .nv06-scene {
      position: absolute;
      inset: 0;
      overflow: hidden; /* REQUIRED — drift translate exposes edges otherwise */
    }
    .nv06-camera {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    .nv06-world {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;

    /* ---- depth-of-field: blurred full plate under a masked sharp copy ----
       Both copies share identical geometry; --dof drives the defocus, the
       sharp layer's mask window is the in-focus plane, --fx racks it across
       the panel. Blur capped ~9px + a gentle dim does the push-back work. */
    .nv06-plate-blur,
    .nv06-plate-sharp {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 50%;
    }
    .nv06-plate-blur {
      --dof: 3px; /* soft falloff already holding on frame one */
      filter: blur(var(--dof));
      will-change: filter, opacity;
      z-index: 1;
    }
    .nv06-plate-sharp {
      /* sharp focal plane ABOVE the blurred one */
      z-index: 2;
      --fx: 51%; /* focus window center — racks 51% -> 22% -> 79% -> 51% */
      --fy: 44%;
      -webkit-mask-image: radial-gradient(
        ellipse 24% 52% at var(--fx) var(--fy),
        #000 28%,
        rgba(0, 0, 0, 0.85) 48%,
        transparent 82%
      );
      mask-image: radial-gradient(
        ellipse 24% 52% at var(--fx) var(--fy),

  </style>

  <div id="root" data-composition-id="06-the-tank" data-duration="6.111" data-width="1920" data-height="1080">

    <div class="clip nv06-stage" data-start="0" data-duration="6.111" data-track-index="1">
      <div class="nv06-scene">
        <div class="nv06-camera" id="nv06-camera">
          <div class="nv06-world">
            <img class="nv06-plate-blur" id="nv06-blur" src="assets/tank-set.webp" alt="" />
            <img class="nv06-plate-sharp" id="nv06-sharp" src="assets/tank-set.webp" alt="" />
          </div>
        </div>

      <!-- Scene 1: mono kicker, bottom-left, inside safe area -->
      <div class="nv06-kicker" id="nv06-kicker"
        ><span class="nv06-kc">T</span><span class="nv06-kc">H</span><span class="nv06-kc">E</span
        ><span class="nv06-ksp"></span><span class="nv06-kc">T</span><span class="nv06-kc">A</span
        ><span class="nv06-kc">N</span><span class="nv06-kc">K</span></div
      >

      <!-- Scene 2: on "ums" — three tiny alert ticks flicker and die -->
      <div class="nv06-ticks">
        <svg class="nv06-tick" id="nv06-t1" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
          <path d="M66 22 L34 118" />

        <svg class="nv06-tick" id="nv06-t2" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">

        ><span class="nv06-w" id="nv06-w2">seconds.</span

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 5.611;
      /* The packet's 9s scene windows compress onto the real 5.611s VO bed:
         S1 0.0-1.2 "Five investors." · S2 1.2-3.75 "read your books / heard
         your ums" · S3 3.75-end "Sixty seconds — out loud." */

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["06-the-tank"] = tl;

      /* ---------- camera: ONE unbroken push toward the desk ----------
         Two sequential phase tweens on a proxy = one continuous move; sine
         micro-drift (freq ratio ~1.3) overlaid, damped to zero in the tail so
         the camera lands in genuine stillness for the held read. */
      var camera = document.getElementById("nv06-camera");
      var cam = { scale: 1.04, ty: 0 };
      tl.to(cam, { scale: 1.09, duration: 1.5, ease: "power1.inOut" }, 0);
      tl.to(cam, { scale: 1.17, ty: -16, duration: 3.2, ease: "power2.inOut" }, 1.5);

      var SETTLE_AT = 3.95; /* drift begins dying as the push lands */
      var SETTLE_FADE = 0.9;
      var drift = { t: 0 };
      tl.to(
        drift,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var t = drift.t;
            var env = t <= SETTLE_AT ? 1 : Math.max(0, 1 - (t - SETTLE_AT) / SETTLE_FADE);
            env = env * env * (3 - 2 * env); /* smoothstep out — no drift snap */
            var dx = Math.sin(t * 0.9) * 4 * env;
            var dy = Math.sin(t * 0.9 * 1.3 + 1.1) * 2.4 * env;
            camera.style.transform =
              "scale(" + cam.scale + ") translate(" + dx.toFixed(2) + "px," + (cam.ty + dy).toFixed(2) + "px)";
          }
        },
        0
      );

      /* ---------- Scene 1 (0.0-1.2) "Five investors." ----------
         DoF falloff establishes: everything but the center shark softens.
         The plate is full-bleed and moving from frame one. */
      tl.fromTo(
        "#nv06-blur",
        { "--dof": "3px", opacity: 1 },
        { "--dof": "9px", opacity: 0.84, duration: 0.7, ease: "power2.out" },
        0
      );
      document.querySelectorAll("#nv06-kicker .nv06-kc").forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 9 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          0.22 + i * 0.04
        );
      });

      /* ---------- Scene 2 (1.2-3.75) rack focus, leg by leg ----------
         "They've read your books" — the focus window PULLS to the left pair;
         "They heard your ums" — it pulls across to the right pair. Same --fx
         property, sequential windows: seamless state hand-off. */
      tl.to("#nv06-sharp", { "--fx": "22%", duration: 0.6, ease: "power2.inOut" }, 1.3);
      tl.to("#nv06-sharp", { "--fx": "79%", duration: 0.65, ease: "power2.inOut" }, 2.65);

      /* on "ums" — three alert ticks flicker at the lower third and die */
      ["#nv06-t1", "#nv06-t2", "#nv06-t3"].forEach(function (id, i) {
        var at = 3.28 + i * 0.09;
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, at);
        tl.to(id, { opacity: 0.2, duration: 0.07, ease: "none" }, at + 0.06);
        tl.to(id, { opacity: 0.95, duration: 0.07, ease: "none" }, at + 0.14);
        tl.to(id, { opacity: 0, duration: 0.16, ease: "power1.in" }, at + 0.34);
      });

      /* ---------- Scene 3 (3.75-end) "Sixty seconds — out loud." ----------
         Refocus: the whole desk sharpens as the push completes (settle sharp
         before the hand-off), the focus window drifting home to center. */
      tl.to(
        "#nv06-blur",
        { "--dof": "0px", opacity: 1, duration: 0.65, ease: "power2.inOut" },
        3.8
      );
      tl.to("#nv06-sharp", { "--fx": "51%", duration: 0.65, ease: "power2.inOut" }, 3.8);

      /* the line reveals per-word on the VO cadence, then the held read */
      var WORD_AT = [3.95, 4.3, 4.65, 4.95];
      ["#nv06-w1", "#nv06-w2", "#nv06-w3", "#nv06-w4"].forEach(function (id, i) {
        tl.fromTo(
          id,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          WORD_AT[i]
        );
      });
    })();
  </script>
